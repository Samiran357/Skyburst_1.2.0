<title>Skyburst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed night-sky stage (sky, skyline, harbour water, glowing canvas on top);
   slim header up top, glass control dock at the bottom. Single deliberate night palette. */
:root{
  --sky:#04040f;
  --ink:#ecebff;
  --muted:#a9a7d6;
  --gold:#ffcf6b;
  --gold-ink:#1a1204;
  --panel:rgba(10,9,32,.66);
  --line:rgba(255,255,255,.16);
  --chip:rgba(255,255,255,.07);
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--sky);color:var(--ink);overflow:hidden;
  font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#stars i{position:absolute;border-radius:50%;background:#dfe3ff;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#lan{z-index:2;pointer-events:none}
#fx{z-index:3;touch-action:none;cursor:crosshair}

.top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{min-width:0}
h1{margin:0;font:700 15px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.stats{display:flex;gap:14px;margin-top:8px;font:400 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.04em}
.stats b{font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;margin-left:4px}
.ghost{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.ghost:hover{border-color:var(--gold)}
body.ui-off .brand,body.ui-off .dock{display:none}

#hint{position:fixed;z-index:4;left:0;right:0;top:34%;text-align:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s ease}
#hint strong{display:block;font:700 clamp(26px,6vw,58px)/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance;
  text-shadow:0 0 40px rgba(255,160,200,.45)}
#hint span{display:block;margin-top:14px;font:400 12px/1.6 var(--font-mono);color:var(--muted);letter-spacing:.05em}
#hint.gone{opacity:0}

.dock{position:fixed;z-index:5;
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  max-height:46vh;overflow-y:auto;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.group{min-width:0;display:flex;flex-direction:column;gap:6px}
.label{font:500 10px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--font-mono);color:var(--ink);
  background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.4)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.go{background:transparent;border-color:var(--gold);color:var(--gold)}
.chip.go:hover{background:var(--gold);color:var(--gold-ink)}
.sw{width:22px;height:10px;border-radius:5px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (min-width:900px){
  .dock{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 30px;padding:14px 18px;max-height:none;overflow:visible}
  .chips{flex-wrap:wrap;overflow:visible}
}
@media (prefers-reduced-motion:reduce){#stars i{animation:none;opacity:.7}}
</style>

<canvas id="bg"></canvas>
<div id="stars" aria-hidden="true"></div>
<canvas id="lan" aria-hidden="true"></canvas>
<canvas id="fx" aria-label="Fireworks sky. Tap or drag to launch shells."></canvas>

<header class="top">
  <div class="brand">
    <h1>Skyburst</h1>
    <div class="stats"><span>Shells<b id="sShells">0</b></span><span>Sparks<b id="sSparks">0</b></span></div>
  </div>
  <button class="ghost" id="uiToggle" type="button">Hide controls</button>
</header>

<div id="hint">
  <strong>Tap the sky</strong>
  <span>Drag to paint a salvo &middot; Space for the finale &middot; L releases lanterns &middot; H hides the controls</span>
</div>

<section class="dock" id="dock" aria-label="Controls">
  <div class="group"><span class="label">Burst</span><div class="chips" id="shapes"></div></div>
  <div class="group"><span class="label">Colors</span><div class="chips" id="pals"></div></div>
  <div class="group"><span class="label">Sky</span><div class="chips" id="skies"></div></div>
  <div class="group"><span class="label">Moon</span><div class="chips" id="moons"></div></div>
  <div class="group"><span class="label">Show</span><div class="chips" id="toggles"></div></div>
</section>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const bg = $('#bg'), fx = $('#fx'), lan = $('#lan');
const bgc = bg.getContext('2d'), fxc = fx.getContext('2d'), lanc = lan.getContext('2d');
let W = 0, H = 0, dpr = 1, water = 0, scale = 1;

/* ---------- options ---------- */
const SHAPES = [
  ['auto','Auto'],['peony','Peony'],['ring','Ring'],['heart','Heart'],['star','Star'],
  ['willow','Willow'],['crackle','Crackle'],['palm','Palm'],['spiral','Spiral'],['double','Double']
];
const REAL_SHAPES = SHAPES.slice(1).map(s => s[0]);
const PALETTES = [
  { id:'festival', name:'Festival', c:[[350,90,62],[40,100,60],[190,90,60],[290,80,66],[130,80,56]] },
  { id:'ember',    name:'Ember',    c:[[8,100,56],[28,100,56],[45,100,62],[0,0,96]] },
  { id:'aurora',   name:'Aurora',   c:[[160,90,56],[190,90,60],[260,80,68],[305,70,66]] },
  { id:'candy',    name:'Candy',    c:[[330,90,72],[170,80,66],[50,95,70],[270,80,76]] },
  { id:'ice',      name:'Ice',      c:[[200,60,80],[210,40,92],[190,80,66],[0,0,100]] },
  { id:'gold',     name:'Gold',     c:[[42,100,58],[36,100,52],[50,100,70]] },
  { id:'prism',    name:'Prism',    rainbow:true, c:[[0,95,60],[60,95,60],[120,95,55],[200,95,60],[280,95,65]] }
];
const state = { shape:'auto', pal:'festival', auto:!reduced, sound:true, slow:false, shells:0, bgk:'night', moon:'full', lanterns:true };
const BGS = {
  night:{ name:'Night',      top:'#03030c', mid:'#0a0a2a', low:'#241044', hor:'#552052', water:['#3a1840','#160a30','#04040e'], far:'#150b30', near:'#07061a', rip:'200,210,255', line:'rgba(255,190,230,.28)' },
  black:{ name:'Pure black', top:'#000000', mid:'#000000', low:'#000000', hor:'#030303', water:['#000000','#000000','#000000'], far:'#0a0a0c', near:'#000000', rip:'255,255,255', line:'rgba(255,255,255,.14)' },
  dusk: { name:'Dusk',       top:'#0c0a2e', mid:'#3b1659', low:'#a8325e', hor:'#ff8a4c', water:['#8a2f55','#3a1240','#0b0716'], far:'#2a0f3e', near:'#10071f', rip:'255,210,200', line:'rgba(255,220,180,.35)' },
  deep: { name:'Deep blue',  top:'#020716', mid:'#06183a', low:'#0b3a66', hor:'#1b6a8f', water:['#124a6b','#0a2848','#030a18'], far:'#0a2142', near:'#040c1d', rip:'190,225,255', line:'rgba(190,230,255,.3)' }
};
const MOONS = {
  full:    { name:'Full',     phase:'full', col:'#e9edff', crater:'rgba(140,150,205,.35)', glow:'170,185,255', ga:.28, size:1 },
  half:    { name:'Half',     phase:'half', col:'#e9edff', glow:'170,185,255', ga:.2,  size:1.05 },
  crescent:{ name:'Crescent', phase:'cres', col:'#f3f4ff', glow:'170,185,255', ga:.2,  size:1.12 },
  blood:   { name:'Blood',    phase:'full', col:'#cf4a35', crater:'rgba(100,15,10,.4)',    glow:'255,70,40',   ga:.32, size:1.15 },
  golden:  { name:'Golden',   phase:'full', col:'#ffd47d', crater:'rgba(170,110,30,.32)',  glow:'255,190,90',  ga:.32, size:1.22 },
  none:    null
};

/* ---------- backdrop ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function drawSkyline(c, flip){
  c.save();
  if (flip){ c.translate(0, 2*water); c.scale(1,-1); c.globalAlpha = .34; }
  const layers = [
    { wmin:26, wmax:60, hmin:30, hmax:95,  col:cur().far, win:0,   seed:11 },
    { wmin:22, wmax:64, hmin:40, hmax:150, col:cur().near, win:.2,  seed:23 }
  ];
  const k = H/800;
  for (const L of layers){
    const r = mulberry(L.seed);
    let x = -10;
    while (x < W + 10){
      const w = (L.wmin + r()*(L.wmax-L.wmin)) * Math.max(.8, Math.min(1.3, W/1100));
      const h = (L.hmin + r()*(L.hmax-L.hmin)) * k;
      c.fillStyle = L.col;
      c.fillRect(x, water-h, w, h+1);
      if (L.win && r() < .22){ c.fillRect(x+w/2-1, water-h-14*k, 2, 14*k); }
      if (L.win){
        for (let wy = water-h+8; wy < water-6; wy += 8){
          for (let wx = x+5; wx < x+w-6; wx += 7){
            if (r() < L.win){
              c.fillStyle = r() < .75 ? 'rgba(255,214,140,.72)' : 'rgba(170,210,255,.6)';
              c.fillRect(wx, wy, 3, 4);
            }
          }
        }
      }
      x += w + r()*3;
    }
  }
  c.restore();
}

function cur(){ return BGS[state.bgk] || BGS.night; }

function drawMoon(c, mx, my, mr, m, alpha){
  c.save();
  c.globalAlpha = alpha;
  c.beginPath(); c.arc(mx,my,mr,0,TAU); c.clip();
  if (m.phase === 'full'){
    c.fillStyle = m.col; c.fillRect(mx-mr,my-mr,mr*2,mr*2);
    c.fillStyle = m.crater;
    [[-.35,-.2,.28],[.25,.15,.2],[-.1,.4,.14],[.35,-.35,.12]].forEach(([dx,dy,k]) => {
      c.beginPath(); c.arc(mx+dx*mr,my+dy*mr,k*mr,0,TAU); c.fill();
    });
  } else {
    c.fillStyle = 'rgba(120,130,180,.14)'; c.fillRect(mx-mr,my-mr,mr*2,mr*2);
    c.fillStyle = m.col;
    if (m.phase === 'half'){ c.fillRect(mx,my-mr,mr,mr*2); }
    else {
      c.beginPath(); c.arc(mx,my,mr,0,TAU); c.arc(mx+mr*.55,my-mr*.12,mr*.92,0,TAU); c.fill('evenodd');
    }
  }
  c.restore();
}

function drawBg(){
  const T = cur(), M = MOONS[state.moon];
  document.body.style.background = T.top;
  bgc.setTransform(dpr,0,0,dpr,0,0);
  bgc.clearRect(0,0,W,H);
  let g = bgc.createLinearGradient(0,0,0,water);
  g.addColorStop(0,T.top); g.addColorStop(.55,T.mid); g.addColorStop(.86,T.low); g.addColorStop(1,T.hor);
  bgc.fillStyle = g; bgc.fillRect(0,0,W,water);

  const mr = Math.max(16, Math.min(W,H)*.03) * (M ? M.size : 1), mx = W*.82, my = Math.min(H*.17, 150);
  if (M){
    g = bgc.createRadialGradient(mx,my,mr*.5,mx,my,mr*7);
    g.addColorStop(0,`rgba(${M.glow},${M.ga})`); g.addColorStop(1,`rgba(${M.glow},0)`);
    bgc.fillStyle = g; bgc.fillRect(mx-mr*7,my-mr*7,mr*14,mr*14);
    drawMoon(bgc,mx,my,mr,M,1);
  }

  g = bgc.createLinearGradient(0,water,0,H);
  g.addColorStop(0,T.water[0]); g.addColorStop(.35,T.water[1]); g.addColorStop(1,T.water[2]);
  bgc.fillStyle = g; bgc.fillRect(0,water,W,H-water);

  drawSkyline(bgc,false);
  drawSkyline(bgc,true);

  const r = mulberry(5);
  for (let i=0;i<70;i++){
    const y = water + 4 + Math.pow(r(),1.4)*(H-water-4), x = r()*W, len = 12 + r()*70*(1+(y-water)/(H-water));
    bgc.fillStyle = `rgba(${T.rip},${.03+r()*.07})`;
    bgc.fillRect(x,y,len,1);
  }
  const my2 = 2*water - my;
  if (M && my2 < H){
    for (let i=0;i<9;i++){
      const y = my2 + (i-4)*mr*.45; if (y<water||y>H) continue;
      bgc.fillStyle = `rgba(${M.glow},${Math.max(.04,.24 - i*.016)})`;
      const wdt = mr*(1.6 - Math.abs(i-4)*.12);
      bgc.fillRect(mx - wdt/2 + Math.sin(i*2.1)*4, y, wdt, 1.5);
    }
  }
  bgc.fillStyle = T.line; bgc.fillRect(0,water,W,1);
}

function makeStars(){
  const host = $('#stars'); host.textContent = '';
  const n = Math.round(clamp(W*H/9000, 40, 130));
  const r = mulberry(99);
  for (let i=0;i<n;i++){
    const s = document.createElement('i');
    const sz = r()<.15 ? 2.2 : 1.2;
    s.style.cssText = `left:${(r()*100).toFixed(2)}%;top:${(Math.pow(r(),1.25)*(water*.8)).toFixed(1)}px;width:${sz}px;height:${sz}px;animation-delay:${(r()*4).toFixed(2)}s;animation-duration:${(2.4+r()*3).toFixed(2)}s`;
    host.appendChild(s);
  }
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  water = Math.round(H*.86);
  scale = clamp(Math.min(W, H*1.25)/760, .6, 1.5);
  for (const c of [bg, lan, fx]){ c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); }
  fxc.setTransform(dpr,0,0,dpr,0,0); lanc.setTransform(dpr,0,0,dpr,0,0);
  drawBg(); makeStars();
}

/* ---------- sound ---------- */
const sfx = {
  ctx:null, master:null, nb:null,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = .75;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = this.nb.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  ok(){ return state.sound && this.ctx; },
  noise(t, dur, type, f0, f1, vol, pan){
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.nb;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0,t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(vol, t+Math.min(.04,dur*.2));
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    src.connect(f); f.connect(g);
    if (pan !== undefined && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(this.master); }
    else g.connect(this.master);
    src.start(t, Math.random()*.5); src.stop(t+dur+.05);
  },
  launch(){
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.noise(t, .75, 'bandpass', 500, 2400, .05);
  },
  boom(x, size, crackle){
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime, pan = clamp(x/W*2-1,-1,1)*.8;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(36,t+.6);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.42*size,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.95);
    o.connect(g);
    if (c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(this.master); } else g.connect(this.master);
    o.start(t); o.stop(t+1);
    this.noise(t, .8, 'lowpass', 900, 160, .3*size, pan);
    const n = crackle ? 9 : 3;
    for (let i=0;i<n;i++) this.noise(t+.12+Math.random()*(crackle?.9:.5), .035, 'highpass', 3200, 3200, .05+Math.random()*.06, pan);
  }
};

/* ---------- particles ---------- */
const MAX = 5200;
const parts = [], glows = [], rockets = [];

function spark(x,y,vx,vy,col,o){
  if (parts.length > MAX) return;
  o = o || {};
  parts.push({
    x, y, px:x, py:y, vx, vy, h:col[0], s:col[1], l:col[2], life:1,
    decay:o.decay ?? .012, drag:o.drag ?? .965, g:o.g ?? .045, size:o.size ?? 1.8,
    tw:!!o.tw, crack:!!o.crack
  });
}

function currentPalette(){ return PALETTES.find(p => p.id === state.pal) || PALETTES[0]; }

function burst(x, y, shape){
  if (shape === 'auto') shape = pick(REAL_SHAPES);
  const pal = currentPalette();
  let cols = pal.c.slice().sort(() => Math.random()-.5).slice(0, Math.random()<.55 ? 1 : 2);
  const base = Math.random()*360;
  const mk = (i,n) => pal.rainbow ? [(base + i/n*300) % 360, 95, 62] : cols[(Math.random()*cols.length)|0];
  const S = (4.4 + Math.random()*1.5) * scale;
  const n0 = Math.round(clamp(130*scale, 90, 190));
  let size = 1;

  if (shape === 'peony'){
    for (let i=0;i<n0;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.9,1.02);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,mk(i,n0),{decay:rand(.011,.016),size:1.9});
    }
  } else if (shape === 'ring'){
    const n = 78, tilt = Math.random()*Math.PI, sq = rand(.3,.75), ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i=0;i<n;i++){
      const a = i/n*TAU, ux = Math.cos(a)*S*1.08, uy = Math.sin(a)*S*1.08*sq;
      spark(x,y,ux*ct-uy*st,ux*st+uy*ct,mk(i,n),{decay:.012,drag:.968,g:.035,size:2.1});
    }
  } else if (shape === 'heart'){
    const n = 86;
    for (let i=0;i<n;i++){
      const t = i/n*TAU, hx = 16*Math.pow(Math.sin(t),3);
      const hy = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      spark(x,y,hx/16*S*1.05,-hy/16*S*1.05,pal.rainbow?[345,90,64]:cols[0],{decay:.0105,drag:.965,g:.028,size:2.3});
    }
  } else if (shape === 'star'){
    const pts = [];
    for (let k=0;k<10;k++){ const a = -Math.PI/2 + k*Math.PI/5, r = k%2 ? .42 : 1; pts.push([Math.cos(a)*r, Math.sin(a)*r]); }
    for (let k=0;k<10;k++){
      const A = pts[k], B = pts[(k+1)%10];
      for (let m=0;m<9;m++){
        const f = m/9;
        spark(x,y,(A[0]+(B[0]-A[0])*f)*S*1.12,(A[1]+(B[1]-A[1])*f)*S*1.12,mk(k,10),{decay:.0115,drag:.966,g:.03,size:2.2});
      }
    }
    for (let i=0;i<14;i++){ const a = Math.random()*TAU, r = Math.random()*.3; spark(x,y,Math.cos(a)*r*S,Math.sin(a)*r*S,[48,100,80],{decay:.02,size:1.5}); }
  } else if (shape === 'willow'){
    const gold = [42,100,60];
    for (let i=0;i<100;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.55,.82);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,Math.random()<.85?gold:mk(i,100),{decay:rand(.0042,.0058),drag:.974,g:.032,size:1.7,tw:true});
    }
    size = 1.15;
  } else if (shape === 'crackle'){
    for (let i=0;i<88;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.7,1.02);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,mk(i,88),{decay:rand(.012,.017),size:2,crack:true});
    }
  } else if (shape === 'palm'){
    const arms = 7 + ((Math.random()*4)|0), off = Math.random()*TAU;
    for (let k=0;k<arms;k++){
      const a = off + k/arms*TAU + rand(-.08,.08), col = mk(k,arms);
      for (let j=0;j<16;j++){
        const sp = S*(.3 + j/16*.95);
        spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,col,{decay:.0085,drag:.972,g:.05,size:2.7,tw:j>11,crack:j===15});
      }
    }
    size = 1.1;
  } else if (shape === 'spiral'){
    const arms = 3, n = 62, off = Math.random()*TAU, dir = Math.random()<.5 ? 1 : -1;
    for (let k=0;k<arms;k++) for (let i=0;i<n;i++){
      const a = off + k*TAU/arms + dir*i*.2, sp = S*(.22 + i/n*.9);
      spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,mk(i+k*n,n*arms),{decay:.0115,drag:.968,g:.034,size:2});
    }
  } else if (shape === 'double'){
    const inner = pal.rainbow ? [(base+180)%360,95,70] : (cols[1] || [0,0,100]);
    const n = 64, tilt = Math.random()*Math.PI, ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i=0;i<n;i++){
      const a = i/n*TAU, ux = Math.cos(a)*S*.55, uy = Math.sin(a)*S*.55*.8;
      spark(x,y,ux*ct-uy*st,ux*st+uy*ct,inner,{decay:.0125,drag:.968,g:.03,size:2.1});
    }
    for (let i=0;i<n0;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.95,1.08);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,pal.rainbow?mk(i,n0):cols[0],{decay:rand(.011,.015),size:1.8});
    }
    size = 1.2;
  }

  const gc = pal.rainbow ? [base,90,62] : cols[0];
  glows.push({ x, y, r:Math.min(W,H)*rand(.34,.5)*size, h:gc[0], s:85, l:60, a:.4, decay:.04 });
  state.shells++;
  sfx.boom(x, clamp(.6 + size*.3, .6, 1), shape === 'crackle' || shape === 'palm');
}

function launch(tx, ty, shape){
  ty = clamp(ty, H*.07, water-90);
  tx = clamp(tx, 12, W-12);
  const sx = clamp(tx + rand(-.07,.07)*W, 12, W-12);
  rockets.push({ sx, sy:water-3, tx, ty, t:0, dur:rand(40,52) + (water-ty)/H*26, x:sx, y:water-3, px:sx, py:water-3, shape:shape || state.shape });
  sfx.launch();
}

function autoShell(){
  launch(rand(.08,.92)*W, rand(.1,.5)*H);
}

const queue = [];
function later(ms, fn){ queue.push({ at:performance.now()+ms, fn }); }

function finale(){
  sfx.init(); sfx.resume();
  const n = 26;
  for (let i=0;i<n;i++){
    later(i*115 + rand(0,60), () => launch((i/(n-1))*W*.86 + W*.07 + rand(-30,30), rand(.1,.45)*H));
  }
  for (let i=0;i<4;i++) later(3200 + i*160, () => launch(W*(.2+i*.2), H*.18));
}

/* ---------- drawing ---------- */
function line(x0,y0,x1,y1,w,h,s,l,a){
  fxc.lineWidth = w;
  fxc.strokeStyle = `hsla(${h},${s}%,${l}%,${a})`;
  fxc.beginPath(); fxc.moveTo(x0,y0); fxc.lineTo(x1+.01,y1); fxc.stroke();
  const m0 = 2*water-y0, m1 = 2*water-y1;
  if (m0 < H+8){
    fxc.strokeStyle = `hsla(${h},${s}%,${l}%,${a*.3})`;
    fxc.beginPath(); fxc.moveTo(x0,m0+Math.sin(x0*.2+m0*.05)*1.5); fxc.lineTo(x1+.01,m1+Math.sin(x1*.2+m1*.05)*1.5); fxc.stroke();
  }
}

function glow(x,y,r,h,s,l,a){
  const g = fxc.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`hsla(${h},${s}%,${l}%,${a})`); g.addColorStop(1,`hsla(${h},${s}%,${l}%,0)`);
  fxc.fillStyle = g; fxc.fillRect(x-r,y-r,r*2,r*2);
}

/* ---------- lanterns ---------- */
const lanterns = [];
const lanTarget = () => clamp(Math.round(W/110), 5, 14);
function spawnLantern(x, seeded){
  const depth = Math.random();
  const s = (13 + depth*20) * clamp(scale,.8,1.3);
  lanterns.push({
    x0: x === undefined ? rand(.04,.96)*W : x,
    y: seeded ? rand(H*.2, H*.97) : H + s*2,
    s, depth, vy: rand(.22,.5)*(.6+depth*.7), ph: Math.random()*TAU,
    sw: rand(8,24)*(.5+depth), age: seeded ? 400 : 0, fl: Math.random()*TAU
  });
}
function seedLanterns(){ lanterns.length = 0; const n = lanTarget(); for (let i=0;i<n;i++) spawnLantern(undefined,true); }
function releaseLanterns(){ for (let i=0;i<7;i++) later(i*220, () => spawnLantern(W*(.12+i*.12)+rand(-30,30))); }

function lanternBody(c,x,y,s,a){
  const w = s, h = s*1.3;
  const g = c.createLinearGradient(0,y-h/2,0,y+h/2);
  g.addColorStop(0,`rgba(255,150,60,${a})`); g.addColorStop(.6,`rgba(255,196,100,${a})`); g.addColorStop(1,`rgba(255,235,160,${a})`);
  c.fillStyle = g; c.beginPath();
  c.moveTo(x-w*.36,y-h/2); c.lineTo(x+w*.36,y-h/2); c.lineTo(x+w*.5,y+h/2); c.lineTo(x-w*.5,y+h/2); c.closePath(); c.fill();
  c.strokeStyle = `rgba(130,45,0,${a*.45})`; c.lineWidth = Math.max(.7,s*.04);
  for (let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(x+k*w*.18,y-h/2); c.lineTo(x+k*w*.25,y+h/2); c.stroke(); }
  c.fillStyle = `rgba(90,30,0,${a*.85})`;
  c.fillRect(x-w*.38,y-h/2-s*.05,w*.76,s*.08); c.fillRect(x-w*.52,y+h/2-s*.03,w*1.04,s*.08);
}
function lanternGlow(c,x,y,r,a){
  const g = c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,160,70,${a})`); g.addColorStop(1,'rgba(255,160,70,0)');
  c.fillStyle = g; c.fillRect(x-r,y-r,r*2,r*2);
}
function drawLanterns(dt, raw){
  lanc.clearRect(0,0,W,H);
  if (!state.lanterns && !lanterns.length) return;
  if (state.lanterns && lanterns.length < lanTarget() && Math.random() < raw/1400) spawnLantern();
  for (let i=lanterns.length-1;i>=0;i--){
    const L = lanterns[i];
    L.age += dt; L.y -= L.vy*dt;
    const x = L.x0 + Math.sin(L.age*.011+L.ph)*L.sw, y = L.y, s = L.s, h = s*1.3;
    if (y < -s*3){ lanterns.splice(i,1); continue; }
    const a = (.5 + .5*L.depth) * clamp(y/(H*.16),0,1);
    const fl = .82 + .18*Math.sin(L.age*.21+L.fl);
    lanc.globalCompositeOperation = 'lighter';
    lanternGlow(lanc,x,y,s*3.4,.34*a*fl);
    lanc.globalCompositeOperation = 'source-over';
    lanternBody(lanc,x,y,s,a);
    lanc.globalCompositeOperation = 'lighter';
    lanternGlow(lanc,x,y+h*.28,s*.7,.9*a*fl);
    lanc.globalCompositeOperation = 'source-over';
    if (y + h/2 < water - 2){
      lanc.save();
      lanc.beginPath(); lanc.rect(0,water,W,H-water); lanc.clip();
      lanc.translate(0,2*water); lanc.scale(1,-1);
      lanternBody(lanc,x,y,s,a*.26);
      lanc.globalCompositeOperation = 'lighter';
      lanternGlow(lanc,x,y,s*3,.16*a*fl);
      lanc.restore();
    }
  }
}

/* ---------- loop ---------- */
let last = performance.now(), autoT = 500, statT = 0;
function frame(now){
  const raw = Math.min(50, now-last); last = now;
  const dt = raw/16.667 * (state.slow ? .35 : 1);

  // timed queue
  for (let i=queue.length-1;i>=0;i--) if (now >= queue[i].at){ const f = queue[i].fn; queue.splice(i,1); f(); }

  // auto show
  if (state.auto){
    autoT -= raw;
    if (autoT <= 0){
      autoShell();
      if (Math.random() < .22){ const k = 1 + ((Math.random()*2)|0); for (let i=1;i<=k;i++) later(i*200, autoShell); }
      autoT = rand(650,1700);
    }
  }

  drawLanterns(dt, raw);

  // fade previous frame (keeps transparency, builds trails)
  fxc.globalCompositeOperation = 'destination-out';
  fxc.fillStyle = `rgba(0,0,0,${1-Math.pow(1-.2, dt)})`;
  fxc.fillRect(0,0,W,H);
  fxc.globalCompositeOperation = 'lighter';
  fxc.lineCap = 'round';

  // glows
  for (let i=glows.length-1;i>=0;i--){
    const g = glows[i];
    glow(g.x,g.y,g.r,g.h,g.s,g.l,g.a);
    g.a -= g.decay*dt;
    if (g.a <= 0) glows.splice(i,1);
  }

  // rockets
  for (let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.t += dt/r.dur;
    const e = 1 - Math.pow(1-Math.min(r.t,1), 2.4);
    r.px = r.x; r.py = r.y;
    r.x = r.sx + (r.tx-r.sx)*e + Math.sin(r.t*26+r.sx)*(1-e)*2.2;
    r.y = r.sy + (r.ty-r.sy)*e;
    spark(r.x,r.y,rand(-.35,.35),rand(.2,.9),[38,100,72],{decay:.065,drag:.92,g:.025,size:1.3});
    line(r.px,r.py,r.x,r.y,2.4,42,100,84,1);
    glow(r.x,r.y,16,40,100,60,.35);
    if (r.t >= 1){ rockets.splice(i,1); burst(r.tx,r.ty,r.shape); }
  }

  // sparks
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.px = p.x; p.py = p.y;
    const d = Math.pow(p.drag, dt);
    p.vx *= d; p.vy = p.vy*d + p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= p.decay*dt;
    if (p.life <= 0 || p.y > water){
      if (p.crack && p.life <= 0){
        for (let k=0;k<4;k++) spark(p.x,p.y,rand(-1.1,1.1),rand(-1.1,1.1),[50,30,92],{decay:rand(.05,.09),drag:.94,g:.02,size:1.2,tw:true});
      }
      parts[i] = parts[parts.length-1]; parts.pop(); continue;
    }
    let a = Math.pow(Math.max(p.life,0), .85);
    if (p.tw) a *= .55 + Math.random()*.45;
    const hot = p.life > .86 ? (p.life-.86)/.14 : 0;
    const l = p.l + (100-p.l)*hot*.85;
    line(p.px,p.py,p.x,p.y,p.size*(.55+.45*p.life),p.h,p.s,l,a);
  }

  fxc.globalCompositeOperation = 'source-over';

  statT += raw;
  if (statT > 220){ statT = 0; $('#sShells').textContent = state.shells; $('#sSparks').textContent = parts.length.toLocaleString('en-US'); }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
let dragging = false, lastDrag = 0;
function firstTouch(){ sfx.init(); sfx.resume(); $('#hint').classList.add('gone'); }
function pos(e){ const r = fx.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
fx.addEventListener('pointerdown', e => {
  firstTouch(); dragging = true; lastDrag = performance.now();
  try{ fx.setPointerCapture(e.pointerId); }catch(_){}
  const [x,y] = pos(e); launch(x,y);
});
fx.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(); if (now-lastDrag < 130) return;
  lastDrag = now; const [x,y] = pos(e); launch(x,y);
});
const stop = () => { dragging = false; };
fx.addEventListener('pointerup', stop); fx.addEventListener('pointercancel', stop);

/* ---------- controls ---------- */
function chipRow(host, items, build){
  items.forEach(it => host.appendChild(build(it)));
}
function setPressed(host, id){
  host.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
}
const shapesEl = $('#shapes'), palsEl = $('#pals'), togEl = $('#toggles');

chipRow(shapesEl, SHAPES, ([id,name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id; b.textContent = name;
  b.addEventListener('click', () => { state.shape = id; setPressed(shapesEl,id); firstTouch(); launch(rand(.25,.75)*W, rand(.15,.4)*H, id); });
  return b;
});
chipRow(palsEl, PALETTES, p => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = p.id;
  const sw = document.createElement('span'); sw.className = 'sw';
  sw.style.background = `linear-gradient(90deg,${p.c.map(c => `hsl(${c[0]},${c[1]}%,${c[2]}%)`).join(',')})`;
  b.appendChild(sw); b.appendChild(document.createTextNode(p.name));
  b.addEventListener('click', () => { state.pal = p.id; setPressed(palsEl,p.id); firstTouch(); launch(rand(.25,.75)*W, rand(.15,.4)*H); });
  return b;
});

const skiesEl = $('#skies'), moonsEl = $('#moons');
chipRow(skiesEl, Object.entries(BGS), ([id,t]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
  const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = `linear-gradient(180deg,${t.top},${t.mid},${t.hor})`;
  b.appendChild(sw); b.appendChild(document.createTextNode(t.name));
  b.addEventListener('click', () => { state.bgk = id; setPressed(skiesEl,id); drawBg(); });
  return b;
});
chipRow(moonsEl, Object.entries(MOONS), ([id,m]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
  b.textContent = m ? m.name : 'No moon';
  b.addEventListener('click', () => { state.moon = id; setPressed(moonsEl,id); drawBg(); });
  return b;
});
setPressed(skiesEl, state.bgk); setPressed(moonsEl, state.moon);

function toggle(key, label, onChange){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = label;
  const sync = () => b.setAttribute('aria-pressed', String(state[key]));
  b.addEventListener('click', () => { state[key] = !state[key]; sync(); if (key==='sound'||key==='auto') firstTouch(); onChange && onChange(); });
  sync(); togEl.appendChild(b); return { b, sync };
}
const tAuto = toggle('auto','Auto show');
const tSound = toggle('sound','Sound');
const tSlow = toggle('slow','Slow-mo');
const tLan = toggle('lanterns','Lanterns');
const rel = document.createElement('button'); rel.type='button'; rel.className='chip go'; rel.textContent='Release lanterns';
rel.addEventListener('click', () => { $('#hint').classList.add('gone'); releaseLanterns(); });
togEl.appendChild(rel);
const fin = document.createElement('button'); fin.type='button'; fin.className='chip go'; fin.textContent='Finale';
fin.addEventListener('click', () => { $('#hint').classList.add('gone'); finale(); });
togEl.appendChild(fin);
setPressed(shapesEl, state.shape); setPressed(palsEl, state.pal);

function setUI(off){
  document.body.classList.toggle('ui-off', off);
  $('#uiToggle').textContent = off ? 'Show controls' : 'Hide controls';
}
$('#uiToggle').addEventListener('click', () => setUI(!document.body.classList.contains('ui-off')));

addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (e.code === 'Space'){ e.preventDefault(); firstTouch(); finale(); }
  else if (e.key === 'h' || e.key === 'H') setUI(!document.body.classList.contains('ui-off'));
  else if (e.key === 'l' || e.key === 'L') releaseLanterns();
  else if (e.key === 'm' || e.key === 'M'){ state.sound = !state.sound; tSound.sync(); }
  else if (/^[0-9]$/.test(e.key)){
    const i = e.key === '0' ? 9 : Number(e.key)-1;
    if (SHAPES[i]){ state.shape = SHAPES[i][0]; setPressed(shapesEl,state.shape); firstTouch(); launch(rand(.3,.7)*W, rand(.15,.4)*H, state.shape); }
  }
});

addEventListener('resize', resize);
resize();
seedLanterns();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

// opening shells so the sky is alive on load
later(250, () => launch(W*.34, H*.26, 'peony'));
later(900, () => launch(W*.66, H*.2, 'ring'));
})();
</script>
