<style>
/* Layout: full-bleed night-sky stage (sky, skyline, harbour water, glowing canvas on top);
   slim header up top, glass control dock at the bottom. Single deliberate night palette. */
:root{
  --sky:#04040f;
  --ink:#ecebff;
  --muted:#a9a7d6;
  --gold:#ffcf6b;
  --gold-ink:#1a1204;
  --panel:rgba(10,9,32,.66);
  --line:rgba(255,255,255,.16);
  --chip:rgba(255,255,255,.07);
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--sky);color:var(--ink);overflow:hidden;
  font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#stars i{position:absolute;border-radius:50%;background:#dfe3ff;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#lan{z-index:2;pointer-events:none}
#fx{z-index:3;touch-action:none;cursor:crosshair}

.top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{min-width:0}
h1{margin:0;font:700 15px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.stats{display:flex;gap:14px;margin-top:8px;font:400 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.04em}
.stats b{font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;margin-left:4px}
.ghost{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.ghost:hover{border-color:var(--gold)}
body.ui-off .brand,body.ui-off .dock{display:none}

#hint{position:fixed;z-index:4;left:0;right:0;top:34%;text-align:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s ease}
#hint strong{display:block;font:700 clamp(26px,6vw,58px)/1.05 var(--font-display);letter-spacing:-.01em;text-wrap:balance;
  text-shadow:0 0 40px rgba(255,160,200,.45)}
#hint span{display:block;margin-top:14px;font:400 12px/1.6 var(--font-mono);color:var(--muted);letter-spacing:.05em}
#hint.gone{opacity:0}

.dock{position:fixed;z-index:5;
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  max-height:46vh;overflow-y:auto;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.group{min-width:0;display:flex;flex-direction:column;gap:6px}
.label{font:500 10px/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--font-mono);color:var(--ink);
  background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.4)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.go{background:transparent;border-color:var(--gold);color:var(--gold)}
.chip.go:hover{background:var(--gold);color:var(--gold-ink)}
.sw{width:22px;height:10px;border-radius:5px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (min-width:900px){
  .dock{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 30px;padding:14px 18px;max-height:none;overflow:visible}
  .chips{flex-wrap:wrap;overflow:visible}
}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (min-width:600px){.tools{flex-direction:row;align-items:center;gap:10px}}
.play{display:inline-flex;align-items:center;gap:9px;font:700 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;
  color:#1a1204;background:linear-gradient(135deg,#ffe3a1,#ffb04a 55%,#ff7a45);border:0;border-radius:999px;
  padding:11px 16px 11px 13px;cursor:pointer;white-space:nowrap;
  box-shadow:0 0 0 0 rgba(255,176,74,.5),0 6px 22px rgba(255,122,69,.35);animation:glowp 2.4s ease-in-out infinite;
  transition:transform .15s,filter .15s}
.play:hover{filter:brightness(1.08);transform:translateY(-1px)}
.play .lan{width:11px;height:14px;display:inline-block;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);
  background:radial-gradient(circle at 50% 72%,#fff4c8 0 24%,transparent 26%),#1a1204}
@keyframes glowp{0%,100%{box-shadow:0 0 0 0 rgba(255,176,74,.5),0 6px 22px rgba(255,122,69,.35)}50%{box-shadow:0 0 0 9px rgba(255,176,74,0),0 6px 26px rgba(255,122,69,.5)}}
#gameHost{position:fixed;inset:0;z-index:100}
@media (prefers-reduced-motion:reduce){#stars i{animation:none;opacity:.7}.play{animation:none}}
</style>

<template id="gameTpl"><style>

.top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);

.card{position:fixed;z-index:6;left:50%;top:44%;transform:translate(-50%,-50%);

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const bg = $('#bg'), fx = $('#fx'), lan = $('#lan');
const bgc = bg.getContext('2d'), fxc = fx.getContext('2d'), lanc = lan.getContext('2d');
let W = 0, H = 0, dpr = 1, water = 0, scale = 1;

/* ---------- options ---------- */
const SHAPES = [
  ['auto','Auto'],['peony','Peony'],['ring','Ring'],['heart','Heart'],['star','Star'],
  ['willow','Willow'],['crackle','Crackle'],['palm','Palm'],['spiral','Spiral'],['double','Double']
];
const REAL_SHAPES = SHAPES.slice(1).map(s => s[0]);
const PALETTES = [
  { id:'festival', name:'Festival', c:[[350,90,62],[40,100,60],[190,90,60],[290,80,66],[130,80,56]] },
  { id:'ember',    name:'Ember',    c:[[8,100,56],[28,100,56],[45,100,62],[0,0,96]] },
  { id:'aurora',   name:'Aurora',   c:[[160,90,56],[190,90,60],[260,80,68],[305,70,66]] },
  { id:'candy',    name:'Candy',    c:[[330,90,72],[170,80,66],[50,95,70],[270,80,76]] },
  { id:'ice',      name:'Ice',      c:[[200,60,80],[210,40,92],[190,80,66],[0,0,100]] },
  { id:'gold',     name:'Gold',     c:[[42,100,58],[36,100,52],[50,100,70]] },
  { id:'prism',    name:'Prism',    rainbow:true, c:[[0,95,60],[60,95,60],[120,95,55],[200,95,60],[280,95,65]] }
];
const state = { shape:'auto', pal:'festival', auto:!reduced, sound:true, slow:false, shells:0, bgk:'night', moon:'full', lanterns:true };
const BGS = {
  night:{ name:'Night',      top:'#03030c', mid:'#0a0a2a', low:'#241044', hor:'#552052', water:['#3a1840','#160a30','#04040e'], far:'#150b30', near:'#07061a', rip:'200,210,255', line:'rgba(255,190,230,.28)' },
  black:{ name:'Pure black', top:'#000000', mid:'#000000', low:'#000000', hor:'#030303', water:['#000000','#000000','#000000'], far:'#0a0a0c', near:'#000000', rip:'255,255,255', line:'rgba(255,255,255,.14)' },
  dusk: { name:'Dusk',       top:'#0c0a2e', mid:'#3b1659', low:'#a8325e', hor:'#ff8a4c', water:['#8a2f55','#3a1240','#0b0716'], far:'#2a0f3e', near:'#10071f', rip:'255,210,200', line:'rgba(255,220,180,.35)' },
  deep: { name:'Deep blue',  top:'#020716', mid:'#06183a', low:'#0b3a66', hor:'#1b6a8f', water:['#124a6b','#0a2848','#030a18'], far:'#0a2142', near:'#040c1d', rip:'190,225,255', line:'rgba(190,230,255,.3)' }
};
const MOONS = {
  full:    { name:'Full',     phase:'full', col:'#e9edff', crater:'rgba(140,150,205,.35)', glow:'170,185,255', ga:.28, size:1 },
  half:    { name:'Half',     phase:'half', col:'#e9edff', glow:'170,185,255', ga:.2,  size:1.05 },
  crescent:{ name:'Crescent', phase:'cres', col:'#f3f4ff', glow:'170,185,255', ga:.2,  size:1.12 },
  blood:   { name:'Blood',    phase:'full', col:'#cf4a35', crater:'rgba(100,15,10,.4)',    glow:'255,70,40',   ga:.32, size:1.15 },
  golden:  { name:'Golden',   phase:'full', col:'#ffd47d', crater:'rgba(170,110,30,.32)',  glow:'255,190,90',  ga:.32, size:1.22 },
  none:    null
};

/* ---------- backdrop ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function drawSkyline(c, flip){
  c.save();
  if (flip){ c.translate(0, 2*water); c.scale(1,-1); c.globalAlpha = .34; }
  const layers = [
    { wmin:26, wmax:60, hmin:30, hmax:95,  col:cur().far, win:0,   seed:11 },
    { wmin:22, wmax:64, hmin:40, hmax:150, col:cur().near, win:.2,  seed:23 }
  ];
  const k = H/800;
  for (const L of layers){
    const r = mulberry(L.seed);
    let x = -10;
    while (x < W + 10){
      const w = (L.wmin + r()*(L.wmax-L.wmin)) * Math.max(.8, Math.min(1.3, W/1100));
      const h = (L.hmin + r()*(L.hmax-L.hmin)) * k;
      c.fillStyle = L.col;
      c.fillRect(x, water-h, w, h+1);
      if (L.win && r() < .22){ c.fillRect(x+w/2-1, water-h-14*k, 2, 14*k); }
      if (L.win){
        for (let wy = water-h+8; wy < water-6; wy += 8){
          for (let wx = x+5; wx < x+w-6; wx += 7){
            if (r() < L.win){
              c.fillStyle = r() < .75 ? 'rgba(255,214,140,.72)' : 'rgba(170,210,255,.6)';
              c.fillRect(wx, wy, 3, 4);
            }
          }
        }
      }
      x += w + r()*3;
    }
  }
  c.restore();
}

function cur(){ return BGS[state.bgk] || BGS.night; }

function drawMoon(c, mx, my, mr, m, alpha){
  c.save();
  c.globalAlpha = alpha;
  c.beginPath(); c.arc(mx,my,mr,0,TAU); c.clip();
  if (m.phase === 'full'){
    c.fillStyle = m.col; c.fillRect(mx-mr,my-mr,mr*2,mr*2);
    c.fillStyle = m.crater;
    [[-.35,-.2,.28],[.25,.15,.2],[-.1,.4,.14],[.35,-.35,.12]].forEach(([dx,dy,k]) => {
      c.beginPath(); c.arc(mx+dx*mr,my+dy*mr,k*mr,0,TAU); c.fill();
    });
  } else {
    c.fillStyle = 'rgba(120,130,180,.14)'; c.fillRect(mx-mr,my-mr,mr*2,mr*2);
    c.fillStyle = m.col;
    if (m.phase === 'half'){ c.fillRect(mx,my-mr,mr,mr*2); }
    else {
      c.beginPath(); c.arc(mx,my,mr,0,TAU); c.arc(mx+mr*.55,my-mr*.12,mr*.92,0,TAU); c.fill('evenodd');
    }
  }
  c.restore();
}

function drawBg(){
  const T = cur(), M = MOONS[state.moon];
  document.body.style.background = T.top;
  bgc.setTransform(dpr,0,0,dpr,0,0);
  bgc.clearRect(0,0,W,H);
  let g = bgc.createLinearGradient(0,0,0,water);
  g.addColorStop(0,T.top); g.addColorStop(.55,T.mid); g.addColorStop(.86,T.low); g.addColorStop(1,T.hor);
  bgc.fillStyle = g; bgc.fillRect(0,0,W,water);

  const mr = Math.max(16, Math.min(W,H)*.03) * (M ? M.size : 1), mx = W*.82, my = Math.min(H*.17, 150);
  if (M){
    g = bgc.createRadialGradient(mx,my,mr*.5,mx,my,mr*7);
    g.addColorStop(0,`rgba(${M.glow},${M.ga})`); g.addColorStop(1,`rgba(${M.glow},0)`);
    bgc.fillStyle = g; bgc.fillRect(mx-mr*7,my-mr*7,mr*14,mr*14);
    drawMoon(bgc,mx,my,mr,M,1);
  }

  g = bgc.createLinearGradient(0,water,0,H);
  g.addColorStop(0,T.water[0]); g.addColorStop(.35,T.water[1]); g.addColorStop(1,T.water[2]);
  bgc.fillStyle = g; bgc.fillRect(0,water,W,H-water);

  drawSkyline(bgc,false);
  drawSkyline(bgc,true);

  const r = mulberry(5);
  for (let i=0;i<70;i++){
    const y = water + 4 + Math.pow(r(),1.4)*(H-water-4), x = r()*W, len = 12 + r()*70*(1+(y-water)/(H-water));
    bgc.fillStyle = `rgba(${T.rip},${.03+r()*.07})`;
    bgc.fillRect(x,y,len,1);
  }
  const my2 = 2*water - my;
  if (M && my2 < H){
    for (let i=0;i<9;i++){
      const y = my2 + (i-4)*mr*.45; if (y<water||y>H) continue;
      bgc.fillStyle = `rgba(${M.glow},${Math.max(.04,.24 - i*.016)})`;
      const wdt = mr*(1.6 - Math.abs(i-4)*.12);
      bgc.fillRect(mx - wdt/2 + Math.sin(i*2.1)*4, y, wdt, 1.5);
    }
  }
  bgc.fillStyle = T.line; bgc.fillRect(0,water,W,1);
}

function makeStars(){
  const host = $('#stars'); host.textContent = '';
  const n = Math.round(clamp(W*H/9000, 40, 130));
  const r = mulberry(99);
  for (let i=0;i<n;i++){
    const s = document.createElement('i');
    const sz = r()<.15 ? 2.2 : 1.2;
    s.style.cssText = `left:${(r()*100).toFixed(2)}%;top:${(Math.pow(r(),1.25)*(water*.8)).toFixed(1)}px;width:${sz}px;height:${sz}px;animation-delay:${(r()*4).toFixed(2)}s;animation-duration:${(2.4+r()*3).toFixed(2)}s`;
    host.appendChild(s);
  }
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  water = Math.round(H*.86);
  scale = clamp(Math.min(W, H*1.25)/760, .6, 1.5);
  for (const c of [bg, lan, fx]){ c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); }
  fxc.setTransform(dpr,0,0,dpr,0,0); lanc.setTransform(dpr,0,0,dpr,0,0);
  drawBg(); makeStars();

let paused = false;

/* ---------- sound ---------- */
const sfx = {
  ctx:null, master:null, nb:null,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = .75;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = this.nb.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  ok(){ return state.sound && this.ctx; },
  noise(t, dur, type, f0, f1, vol, pan){
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.nb;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0,t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(vol, t+Math.min(.04,dur*.2));
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    src.connect(f); f.connect(g);
    if (pan !== undefined && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(this.master); }
    else g.connect(this.master);
    src.start(t, Math.random()*.5); src.stop(t+dur+.05);
  },
  launch(){
    if (!this.ok()) return; const t = this.ctx.currentTime;
    this.noise(t, .75, 'bandpass', 500, 2400, .05);
  },
  boom(x, size, crackle){
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime, pan = clamp(x/W*2-1,-1,1)*.8;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(36,t+.6);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.42*size,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.95);
    o.connect(g);
    if (c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(this.master); } else g.connect(this.master);
    o.start(t); o.stop(t+1);
    this.noise(t, .8, 'lowpass', 900, 160, .3*size, pan);
    const n = crackle ? 9 : 3;
    for (let i=0;i<n;i++) this.noise(t+.12+Math.random()*(crackle?.9:.5), .035, 'highpass', 3200, 3200, .05+Math.random()*.06, pan);
  }
};

/* ---------- particles ---------- */
const MAX = 5200;
const parts = [], glows = [], rockets = [];

function spark(x,y,vx,vy,col,o){
  if (parts.length > MAX) return;
  o = o || {};
  parts.push({
    x, y, px:x, py:y, vx, vy, h:col[0], s:col[1], l:col[2], life:1,
    decay:o.decay ?? .012, drag:o.drag ?? .965, g:o.g ?? .045, size:o.size ?? 1.8,
    tw:!!o.tw, crack:!!o.crack
  });
}

function currentPalette(){ return PALETTES.find(p => p.id === state.pal) || PALETTES[0]; }

function burst(x, y, shape){
  if (shape === 'auto') shape = pick(REAL_SHAPES);
  const pal = currentPalette();
  let cols = pal.c.slice().sort(() => Math.random()-.5).slice(0, Math.random()<.55 ? 1 : 2);
  const base = Math.random()*360;
  const mk = (i,n) => pal.rainbow ? [(base + i/n*300) % 360, 95, 62] : cols[(Math.random()*cols.length)|0];
  const S = (4.4 + Math.random()*1.5) * scale;
  const n0 = Math.round(clamp(130*scale, 90, 190));
  let size = 1;

  if (shape === 'peony'){
    for (let i=0;i<n0;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.9,1.02);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,mk(i,n0),{decay:rand(.011,.016),size:1.9});
    }
  } else if (shape === 'ring'){
    const n = 78, tilt = Math.random()*Math.PI, sq = rand(.3,.75), ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i=0;i<n;i++){
      const a = i/n*TAU, ux = Math.cos(a)*S*1.08, uy = Math.sin(a)*S*1.08*sq;
      spark(x,y,ux*ct-uy*st,ux*st+uy*ct,mk(i,n),{decay:.012,drag:.968,g:.035,size:2.1});
    }
  } else if (shape === 'heart'){
    const n = 86;
    for (let i=0;i<n;i++){
      const t = i/n*TAU, hx = 16*Math.pow(Math.sin(t),3);
      const hy = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      spark(x,y,hx/16*S*1.05,-hy/16*S*1.05,pal.rainbow?[345,90,64]:cols[0],{decay:.0105,drag:.965,g:.028,size:2.3});
    }
  } else if (shape === 'star'){
    const pts = [];
    for (let k=0;k<10;k++){ const a = -Math.PI/2 + k*Math.PI/5, r = k%2 ? .42 : 1; pts.push([Math.cos(a)*r, Math.sin(a)*r]); }
    for (let k=0;k<10;k++){
      const A = pts[k], B = pts[(k+1)%10];
      for (let m=0;m<9;m++){
        const f = m/9;
        spark(x,y,(A[0]+(B[0]-A[0])*f)*S*1.12,(A[1]+(B[1]-A[1])*f)*S*1.12,mk(k,10),{decay:.0115,drag:.966,g:.03,size:2.2});
      }
    }
    for (let i=0;i<14;i++){ const a = Math.random()*TAU, r = Math.random()*.3; spark(x,y,Math.cos(a)*r*S,Math.sin(a)*r*S,[48,100,80],{decay:.02,size:1.5}); }
  } else if (shape === 'willow'){
    const gold = [42,100,60];
    for (let i=0;i<100;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.55,.82);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,Math.random()<.85?gold:mk(i,100),{decay:rand(.0042,.0058),drag:.974,g:.032,size:1.7,tw:true});
    }
    size = 1.15;
  } else if (shape === 'crackle'){
    for (let i=0;i<88;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.7,1.02);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,mk(i,88),{decay:rand(.012,.017),size:2,crack:true});
    }
  } else if (shape === 'palm'){
    const arms = 7 + ((Math.random()*4)|0), off = Math.random()*TAU;
    for (let k=0;k<arms;k++){
      const a = off + k/arms*TAU + rand(-.08,.08), col = mk(k,arms);
      for (let j=0;j<16;j++){
        const sp = S*(.3 + j/16*.95);
        spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,col,{decay:.0085,drag:.972,g:.05,size:2.7,tw:j>11,crack:j===15});
      }
    }
    size = 1.1;
  } else if (shape === 'spiral'){
    const arms = 3, n = 62, off = Math.random()*TAU, dir = Math.random()<.5 ? 1 : -1;
    for (let k=0;k<arms;k++) for (let i=0;i<n;i++){
      const a = off + k*TAU/arms + dir*i*.2, sp = S*(.22 + i/n*.9);
      spark(x,y,Math.cos(a)*sp,Math.sin(a)*sp,mk(i+k*n,n*arms),{decay:.0115,drag:.968,g:.034,size:2});
    }
  } else if (shape === 'double'){
    const inner = pal.rainbow ? [(base+180)%360,95,70] : (cols[1] || [0,0,100]);
    const n = 64, tilt = Math.random()*Math.PI, ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i=0;i<n;i++){
      const a = i/n*TAU, ux = Math.cos(a)*S*.55, uy = Math.sin(a)*S*.55*.8;
      spark(x,y,ux*ct-uy*st,ux*st+uy*ct,inner,{decay:.0125,drag:.968,g:.03,size:2.1});
    }
    for (let i=0;i<n0;i++){
      const z = Math.random()*2-1, a = Math.random()*TAU, r = Math.sqrt(1-z*z), sp = S*rand(.95,1.08);
      spark(x,y,Math.cos(a)*r*sp,Math.sin(a)*r*sp,pal.rainbow?mk(i,n0):cols[0],{decay:rand(.011,.015),size:1.8});
    }
    size = 1.2;
  }

  const gc = pal.rainbow ? [base,90,62] : cols[0];
  glows.push({ x, y, r:Math.min(W,H)*rand(.34,.5)*size, h:gc[0], s:85, l:60, a:.4, decay:.04 });
  state.shells++;
  sfx.boom(x, clamp(.6 + size*.3, .6, 1), shape === 'crackle' || shape === 'palm');
}

function launch(tx, ty, shape){
  if (paused) return;
  ty = clamp(ty, H*.07, water-90);
  tx = clamp(tx, 12, W-12);
  const sx = clamp(tx + rand(-.07,.07)*W, 12, W-12);
  rockets.push({ sx, sy:water-3, tx, ty, t:0, dur:rand(40,52) + (water-ty)/H*26, x:sx, y:water-3, px:sx, py:water-3, shape:shape || state.shape });
  sfx.launch();
}

function autoShell(){
  launch(rand(.08,.92)*W, rand(.1,.5)*H);
}

const queue = [];
function later(ms, fn){ queue.push({ at:performance.now()+ms, fn }); }

function finale(){
  sfx.init(); sfx.resume();
  const n = 26;
  for (let i=0;i<n;i++){
    later(i*115 + rand(0,60), () => launch((i/(n-1))*W*.86 + W*.07 + rand(-30,30), rand(.1,.45)*H));
  }
  for (let i=0;i<4;i++) later(3200 + i*160, () => launch(W*(.2+i*.2), H*.18));
}

/* ---------- drawing ---------- */
function line(x0,y0,x1,y1,w,h,s,l,a){
  fxc.lineWidth = w;
  fxc.strokeStyle = `hsla(${h},${s}%,${l}%,${a})`;
  fxc.beginPath(); fxc.moveTo(x0,y0); fxc.lineTo(x1+.01,y1); fxc.stroke();
  const m0 = 2*water-y0, m1 = 2*water-y1;
  if (m0 < H+8){
    fxc.strokeStyle = `hsla(${h},${s}%,${l}%,${a*.3})`;
    fxc.beginPath(); fxc.moveTo(x0,m0+Math.sin(x0*.2+m0*.05)*1.5); fxc.lineTo(x1+.01,m1+Math.sin(x1*.2+m1*.05)*1.5); fxc.stroke();
  }
}

function glow(x,y,r,h,s,l,a){
  const g = fxc.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`hsla(${h},${s}%,${l}%,${a})`); g.addColorStop(1,`hsla(${h},${s}%,${l}%,0)`);
  fxc.fillStyle = g; fxc.fillRect(x-r,y-r,r*2,r*2);
}

/* ---------- lanterns ---------- */
const lanterns = [];
const lanTarget = () => clamp(Math.round(W/110), 5, 14);
function spawnLantern(x, seeded){
  const depth = Math.random();
  const s = (13 + depth*20) * clamp(scale,.8,1.3);
  lanterns.push({
    x0: x === undefined ? rand(.04,.96)*W : x,
    y: seeded ? rand(H*.2, H*.97) : H + s*2,
    s, depth, vy: rand(.22,.5)*(.6+depth*.7), ph: Math.random()*TAU,
    sw: rand(8,24)*(.5+depth), age: seeded ? 400 : 0, fl: Math.random()*TAU
  });
}
function seedLanterns(){ lanterns.length = 0; const n = lanTarget(); for (let i=0;i<n;i++) spawnLantern(undefined,true); }
function releaseLanterns(){ for (let i=0;i<7;i++) later(i*220, () => spawnLantern(W*(.12+i*.12)+rand(-30,30))); }

function lanternBody(c,x,y,s,a){
  const w = s, h = s*1.3;
  const g = c.createLinearGradient(0,y-h/2,0,y+h/2);
  g.addColorStop(0,`rgba(255,150,60,${a})`); g.addColorStop(.6,`rgba(255,196,100,${a})`); g.addColorStop(1,`rgba(255,235,160,${a})`);
  c.fillStyle = g; c.beginPath();
  c.moveTo(x-w*.36,y-h/2); c.lineTo(x+w*.36,y-h/2); c.lineTo(x+w*.5,y+h/2); c.lineTo(x-w*.5,y+h/2); c.closePath(); c.fill();
  c.strokeStyle = `rgba(130,45,0,${a*.45})`; c.lineWidth = Math.max(.7,s*.04);
  for (let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(x+k*w*.18,y-h/2); c.lineTo(x+k*w*.25,y+h/2); c.stroke(); }
  c.fillStyle = `rgba(90,30,0,${a*.85})`;
  c.fillRect(x-w*.38,y-h/2-s*.05,w*.76,s*.08); c.fillRect(x-w*.52,y+h/2-s*.03,w*1.04,s*.08);
}
function lanternGlow(c,x,y,r,a){
  const g = c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,160,70,${a})`); g.addColorStop(1,'rgba(255,160,70,0)');
  c.fillStyle = g; c.fillRect(x-r,y-r,r*2,r*2);
}
function drawLanterns(dt, raw){
  lanc.clearRect(0,0,W,H);
  if (!state.lanterns && !lanterns.length) return;
  if (state.lanterns && lanterns.length < lanTarget() && Math.random() < raw/1400) spawnLantern();
  for (let i=lanterns.length-1;i>=0;i--){
    const L = lanterns[i];
    L.age += dt; L.y -= L.vy*dt;
    const x = L.x0 + Math.sin(L.age*.011+L.ph)*L.sw, y = L.y, s = L.s, h = s*1.3;
    if (y < -s*3){ lanterns.splice(i,1); continue; }
    const a = (.5 + .5*L.depth) * clamp(y/(H*.16),0,1);
    const fl = .82 + .18*Math.sin(L.age*.21+L.fl);
    lanc.globalCompositeOperation = 'lighter';
    lanternGlow(lanc,x,y,s*3.4,.34*a*fl);
    lanc.globalCompositeOperation = 'source-over';
    lanternBody(lanc,x,y,s,a);
    lanc.globalCompositeOperation = 'lighter';
    lanternGlow(lanc,x,y+h*.28,s*.7,.9*a*fl);
    lanc.globalCompositeOperation = 'source-over';
    if (y + h/2 < water - 2){
      lanc.save();
      lanc.beginPath(); lanc.rect(0,water,W,H-water); lanc.clip();
      lanc.translate(0,2*water); lanc.scale(1,-1);
      lanternBody(lanc,x,y,s,a*.26);
      lanc.globalCompositeOperation = 'lighter';
      lanternGlow(lanc,x,y,s*3,.16*a*fl);
      lanc.restore();
    }
  }
}

/* ---------- loop ---------- */
let last = performance.now(), autoT = 500, statT = 0;
function frame(now){
  const raw = Math.min(50, now-last); last = now;
  if (paused){ requestAnimationFrame(frame); return; }
  const dt = raw/16.667 * (state.slow ? .35 : 1);

  // timed queue
  for (let i=queue.length-1;i>=0;i--) if (now >= queue[i].at){ const f = queue[i].fn; queue.splice(i,1); f(); }

  // auto show
  if (state.auto){
    autoT -= raw;
    if (autoT <= 0){
      autoShell();
      if (Math.random() < .22){ const k = 1 + ((Math.random()*2)|0); for (let i=1;i<=k;i++) later(i*200, autoShell); }
      autoT = rand(650,1700);
    }
  }

  drawLanterns(dt, raw);

  // fade previous frame (keeps transparency, builds trails)
  fxc.globalCompositeOperation = 'destination-out';
  fxc.fillStyle = `rgba(0,0,0,${1-Math.pow(1-.2, dt)})`;
  fxc.fillRect(0,0,W,H);
  fxc.globalCompositeOperation = 'lighter';
  fxc.lineCap = 'round';

  // glows
  for (let i=glows.length-1;i>=0;i--){
    const g = glows[i];
    glow(g.x,g.y,g.r,g.h,g.s,g.l,g.a);
    g.a -= g.decay*dt;
    if (g.a <= 0) glows.splice(i,1);
  }

  // rockets
  for (let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.t += dt/r.dur;
    const e = 1 - Math.pow(1-Math.min(r.t,1), 2.4);
    r.px = r.x; r.py = r.y;
    r.x = r.sx + (r.tx-r.sx)*e + Math.sin(r.t*26+r.sx)*(1-e)*2.2;
    r.y = r.sy + (r.ty-r.sy)*e;
    spark(r.x,r.y,rand(-.35,.35),rand(.2,.9),[38,100,72],{decay:.065,drag:.92,g:.025,size:1.3});
    line(r.px,r.py,r.x,r.y,2.4,42,100,84,1);
    glow(r.x,r.y,16,40,100,60,.35);
    if (r.t >= 1){ rockets.splice(i,1); burst(r.tx,r.ty,r.shape); }
  }

  // sparks
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.px = p.x; p.py = p.y;
    const d = Math.pow(p.drag, dt);
    p.vx *= d; p.vy = p.vy*d + p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= p.decay*dt;
    if (p.life <= 0 || p.y > water){
      if (p.crack && p.life <= 0){
        for (let k=0;k<4;k++) spark(p.x,p.y,rand(-1.1,1.1),rand(-1.1,1.1),[50,30,92],{decay:rand(.05,.09),drag:.94,g:.02,size:1.2,tw:true});
      }
      parts[i] = parts[parts.length-1]; parts.pop(); continue;
    }
    let a = Math.pow(Math.max(p.life,0), .85);
    if (p.tw) a *= .55 + Math.random()*.45;
    const hot = p.life > .86 ? (p.life-.86)/.14 : 0;
    const l = p.l + (100-p.l)*hot*.85;
    line(p.px,p.py,p.x,p.y,p.size*(.55+.45*p.life),p.h,p.s,l,a);
  }

  fxc.globalCompositeOperation = 'source-over';

  statT += raw;
  if (statT > 220){ statT = 0; $('#sShells').textContent = state.shells; $('#sSparks').textContent = parts.length.toLocaleString('en-US'); }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
let dragging = false, lastDrag = 0;
function firstTouch(){ sfx.init(); sfx.resume(); $('#hint').classList.add('gone'); }
function pos(e){ const r = fx.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
fx.addEventListener('pointerdown', e => {
  firstTouch(); dragging = true; lastDrag = performance.now();
  try{ fx.setPointerCapture(e.pointerId); }catch(_){}
  const [x,y] = pos(e); launch(x,y);
});
fx.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(); if (now-lastDrag < 130) return;
  lastDrag = now; const [x,y] = pos(e); launch(x,y);
});
const stop = () => { dragging = false; };
fx.addEventListener('pointerup', stop); fx.addEventListener('pointercancel', stop);

/* ---------- controls ---------- */
function chipRow(host, items, build){
  items.forEach(it => host.appendChild(build(it)));
}
function setPressed(host, id){
  host.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
}
const shapesEl = $('#shapes'), palsEl = $('#pals'), togEl = $('#toggles');

chipRow(shapesEl, SHAPES, ([id,name]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id; b.textContent = name;
  b.addEventListener('click', () => { state.shape = id; setPressed(shapesEl,id); firstTouch(); launch(rand(.25,.75)*W, rand(.15,.4)*H, id); });
  return b;
});
chipRow(palsEl, PALETTES, p => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = p.id;
  const sw = document.createElement('span'); sw.className = 'sw';
  sw.style.background = `linear-gradient(90deg,${p.c.map(c => `hsl(${c[0]},${c[1]}%,${c[2]}%)`).join(',')})`;
  b.appendChild(sw); b.appendChild(document.createTextNode(p.name));
  b.addEventListener('click', () => { state.pal = p.id; setPressed(palsEl,p.id); firstTouch(); launch(rand(.25,.75)*W, rand(.15,.4)*H); });
  return b;
});

const skiesEl = $('#skies'), moonsEl = $('#moons');
chipRow(skiesEl, Object.entries(BGS), ([id,t]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
  const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = `linear-gradient(180deg,${t.top},${t.mid},${t.hor})`;
  b.appendChild(sw); b.appendChild(document.createTextNode(t.name));
  b.addEventListener('click', () => { state.bgk = id; setPressed(skiesEl,id); drawBg(); });
  return b;
});
chipRow(moonsEl, Object.entries(MOONS), ([id,m]) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
  b.textContent = m ? m.name : 'No moon';
  b.addEventListener('click', () => { state.moon = id; setPressed(moonsEl,id); drawBg(); });
  return b;
});
setPressed(skiesEl, state.bgk); setPressed(moonsEl, state.moon);

function toggle(key, label, onChange){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = label;
  const sync = () => b.setAttribute('aria-pressed', String(state[key]));
  b.addEventListener('click', () => { state[key] = !state[key]; sync(); if (key==='sound'||key==='auto') firstTouch(); onChange && onChange(); });
  sync(); togEl.appendChild(b); return { b, sync };
}
const tAuto = toggle('auto','Auto show');
const tSound = toggle('sound','Sound');
const tSlow = toggle('slow','Slow-mo');
const tLan = toggle('lanterns','Lanterns');
const rel = document.createElement('button'); rel.type='button'; rel.className='chip go'; rel.textContent='Release lanterns';
rel.addEventListener('click', () => { $('#hint').classList.add('gone'); releaseLanterns(); });
togEl.appendChild(rel);
const fin = document.createElement('button'); fin.type='button'; fin.className='chip go'; fin.textContent='Finale';
fin.addEventListener('click', () => { $('#hint').classList.add('gone'); finale(); });
togEl.appendChild(fin);
setPressed(shapesEl, state.shape); setPressed(palsEl, state.pal);

function setUI(off){
  document.body.classList.toggle('ui-off', off);
  $('#uiToggle').textContent = off ? 'Show controls' : 'Hide controls';
}
$('#uiToggle').addEventListener('click', () => setUI(!document.body.classList.contains('ui-off')));

addEventListener('keydown', e => {
  if (window.__gameOpen) return;
  if (e.target && e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (e.code === 'Space'){ e.preventDefault(); firstTouch(); finale(); }
  else if (e.key === 'h' || e.key === 'H') setUI(!document.body.classList.contains('ui-off'));
  else if (e.key === 'l' || e.key === 'L') releaseLanterns();
  else if (e.key === 'm' || e.key === 'M'){ state.sound = !state.sound; tSound.sync(); }
  else if (/^[0-9]$/.test(e.key)){
    const i = e.key === '0' ? 9 : Number(e.key)-1;
    if (SHAPES[i]){ state.shape = SHAPES[i][0]; setPressed(shapesEl,state.shape); firstTouch(); launch(rand(.3,.7)*W, rand(.15,.4)*H, state.shape); }
  }
});

$('#playGame').addEventListener('click', () => { firstTouch(); if (window.__openDriftwish) window.__openDriftwish(); });
window.__skyburst = { pause(p){ paused = p; if (p){ queue.length = 0; dragging = false; } } };
addEventListener('resize', resize);
resize();
seedLanterns();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

// opening shells so the sky is alive on load
later(250, () => launch(W*.34, H*.26, 'peony'));
later(900, () => launch(W*.66, H*.2, 'ring'));
})();
</script>
<script>
function mountDriftwish(root, onExit){
'use strict';
const $ = s => root.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const cv = $('#c'), ctx = cv.getContext('2d');
const bgc = document.createElement('canvas'), bgx = bgc.getContext('2d');
let W = 0, H = 0, dpr = 1, water = 0, scale = 1;

const TYPES = {
  push:  { name:'Push',  hue:18,  col:'255,122,69' },
  pull:  { name:'Pull',  hue:197, col:'79,209,255' },
  brake: { name:'Calm',  hue:262, col:'201,184,255' }
};

/* ---------- game state ---------- */
const G = {
  mode:'ready', level:1, flame:100, t:0, clock:0,
  L:{ x:0, y:0, vx:0, vy:0, out:false, s:24, grow:1 },
  clouds:[], pickups:[], moon:{ x:0, y:0, r:34 },
  shells:{ push:0, pull:0, brake:0 }, sel:'push',
  pending:[], shocks:[], parts:[], glows:[], streaks:[],
  collected:0, outT:0, aim:null, amp:.2, ph:0, R:170, grace:0
};
let epoch = 0, best = 1;
try { best = Math.max(1, Number(localStorage.getItem('driftwish-best')) || 1); } catch(_) {}

function later(ms, fn){ const e = epoch; setTimeout(() => { if (e === epoch) fn(); }, ms); }

/* ---------- sound ---------- */
const sfx = {
  ctx:null, on:true, nb:null,
  init(){
    if (this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      const m = this.ctx.createGain(); m.gain.value = .7;
      const comp = this.ctx.createDynamicsCompressor(); m.connect(comp); comp.connect(this.ctx.destination);
      this.out = m;
      const len = this.ctx.sampleRate, b = this.ctx.createBuffer(1,len,this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1; this.nb = b;
    }catch(e){ this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  tone(f0,f1,dur,vol,type,delay){
    if (!this.on || !this.ctx) return; const c = this.ctx, t = c.currentTime + (delay||0);
    const o = c.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0,t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t+dur+.05);
  },
  noise(dur,type,f0,f1,vol,delay){
    if (!this.on || !this.ctx) return; const c = this.ctx, t = c.currentTime + (delay||0);
    const s = c.createBufferSource(); s.buffer = this.nb;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0,t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random()*.4); s.stop(t+dur+.05);
  },
  whoosh(){ this.noise(.3,'bandpass',500,2200,.05); },
  boom(type){
    if (type === 'pull'){ this.tone(260,70,.45,.2,'sine'); this.noise(.4,'bandpass',2200,400,.08); }
    else if (type === 'brake'){ this.tone(520,320,.5,.14,'triangle'); this.noise(.5,'lowpass',900,200,.1); }
    else { this.tone(120,38,.6,.4,'sine'); this.noise(.7,'lowpass',900,160,.3); }
  },
  chime(){ this.tone(988,988,.25,.12,'sine'); this.tone(1480,1480,.35,.1,'sine',.07); },
  splash(){ this.noise(.5,'lowpass',1800,300,.2); },
  out(){ this.tone(220,80,.7,.18,'sawtooth'); },
  win(){ [523,659,784,1047,1319].forEach((f,i) => this.tone(f,f,.5,.13,'triangle',i*.11)); }
};

/* ---------- layout and backdrop ---------- */
function drawBgCache(){
  const c = bgx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  let g = c.createLinearGradient(0,0,0,water);
  g.addColorStop(0,'#03030c'); g.addColorStop(.55,'#0b0a2c'); g.addColorStop(.86,'#2a1046'); g.addColorStop(1,'#5b2257');
  c.fillStyle = g; c.fillRect(0,0,W,water);
  const r = mulberry(42);
  for (let i=0;i<110;i++){
    const x = r()*W, y = Math.pow(r(),1.3)*water*.85, big = r()<.12;
    c.fillStyle = `rgba(225,230,255,${.25+r()*.6})`; c.fillRect(x,y,big?2:1.2,big?2:1.2);
  }
  const k = H/800;
  c.fillStyle = '#12092a';
  let x = -8; const r2 = mulberry(8);
  while (x < W+8){ const w = 24+r2()*46, h = (24+r2()*80)*k; c.fillRect(x,water-h,w,h+1); x += w+r2()*3; }
  g = c.createLinearGradient(0,water,0,H);
  g.addColorStop(0,'#3a1840'); g.addColorStop(.35,'#160a30'); g.addColorStop(1,'#04040e');
  c.fillStyle = g; c.fillRect(0,water,W,H-water);
  const r3 = mulberry(5);
  for (let i=0;i<50;i++){
    const y = water+4+Math.pow(r3(),1.4)*(H-water-4), xx = r3()*W, len = 12+r3()*60;
    c.fillStyle = `rgba(200,210,255,${.03+r3()*.06})`; c.fillRect(xx,y,len,1);
  }
  c.fillStyle = 'rgba(255,190,230,.28)'; c.fillRect(0,water,W,1);
}

function layout(){
  const pw = W, ph = H;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  water = Math.round(H*.88);
  scale = clamp(Math.min(W, H*.9)/620, .7, 1.35);
  G.R = clamp(Math.min(W,H)*.27, 120, 220);
  for (const c of [cv, bgc]){ c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBgCache();
  if (pw && (Math.abs(pw-W)/pw > .25 || Math.abs(ph-H)/ph > .25)) startLevel(G.level, G.mode === 'ready');
}

/* ---------- levels ---------- */
function windAt(y, t){
  return G.amp*(Math.sin(y*.011 + t*.55 + G.ph)*.85 + .4*Math.sin(t*.23 + G.ph*2));
}

const TIPS = {
  1:'Press, aim, release. The blast shoves the lantern away from it. Reach the moon.',
  2:'Storm clouds snuff the flame. Blast them away or steer around them.',
  3:'Blue Pull shells draw the lantern toward the burst.',
  5:'Silver Calm shells kill the lantern’s speed inside the ring.'
};

function startLevel(n, ready){
  epoch++;
  G.level = n; G.t = 0; G.flame = 100; G.collected = 0; G.outT = 0; G.aim = null; G.grace = 70;
  G.pending = []; G.shocks = []; G.parts = []; G.glows = [];
  hideCard();
  const r = mulberry(n*7919 + 13);
  G.amp = clamp(.15 + (n-1)*.11, .15, 1.15); G.ph = r()*TAU;
  G.shells = { push: n === 1 ? 8 : 7, pull: n >= 3 ? 3 : 0, brake: n >= 5 ? 2 : 0 };
  G.sel = 'push';

  const sx = W*(.18 + .64*r()), sy = water - 70;
  Object.assign(G.L, { x:sx, y:sy, vx:0, vy:0, out:false, s:24*scale, grow:1 });

  let mx = W*.5; for (let i=0;i<30;i++){ mx = W*(.14 + .72*r()); if (Math.abs(mx-sx) > W*.3) break; }
  const my = Math.max(132, H*(.12 + .1*r()));
  G.moon = { x:mx, y:my, r:34*scale };

  G.clouds = [];
  const nc = n < 2 ? 0 : clamp(Math.floor(n*.75), 1, 7);
  for (let i=0, tries=0; i<nc && tries<80; tries++){
    const cr = (40 + r()*34)*scale, cx = W*(.1 + .8*r()), cy = H*(.26 + .38*r());
    if (hyp(cx-sx,cy-sy) < cr+130 || hyp(cx-mx,cy-my) < cr+100) continue;
    const puffs = []; const pn = 4 + ((r()*3)|0);
    for (let k=0;k<pn;k++){ const a = r()*TAU, d = r()*cr*.55; puffs.push([Math.cos(a)*d, Math.sin(a)*d*.6, cr*(.45+r()*.3)]); }
    G.clouds.push({ x:cx, y:cy, r:cr, vx:0, vy:0, puffs, flash:r()*4, id:i });
    i++;
  }

  G.pickups = [];
  for (let i=1;i<=3;i++){
    const f = i/4;
    G.pickups.push({
      x: clamp(lerp(sx,mx,f) + (r()-.5)*W*.3, 30, W-30),
      y: clamp(lerp(sy,my,f) + (r()-.5)*H*.14, 118, water-110),
      got:false, ph:r()*TAU
    });
  }

  G.streaks = [];
  for (let i=0;i<34;i++) G.streaks.push({ x:Math.random()*W, y:rand(H*.12, water-20), len:rand(24,70), sp:rand(.7,1.4) });

  G.mode = ready ? 'ready' : 'play';
  $('#tip').textContent = TIPS[n] || (n > 5 ? 'Wind is shown by the pale streaks. Read it before you fire.' : '');
  $('#tip').style.opacity = 1;
  syncHUD();
  if (ready) showStart();
}

/* ---------- cards and HUD ---------- */
function showCard(title, text, btns, stars){
  $('#cTitle').textContent = title; $('#cText').textContent = text;
  const sEl = $('#cStars');
  if (stars === undefined){ sEl.hidden = true; }
  else { sEl.hidden = false; sEl.textContent = '★'.repeat(stars) + '☆'.repeat(3-stars); sEl.setAttribute('aria-label', stars + ' of 3 stars'); }
  const row = $('#cBtns'); row.textContent = '';
  btns.forEach(b => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'btn' + (b.primary ? ' primary' : '');
    el.textContent = b.label; el.addEventListener('click', () => { sfx.init(); sfx.resume(); b.fn(); });
    row.appendChild(el);
  });
  $('#card').hidden = false;
  const p = row.querySelector('.primary'); if (p) p.focus({ preventScroll:true });
}
function hideCard(){ $('#card').hidden = true; }

function showStart(){
  const btns = [{ label:'Light the lantern', primary:true, fn:() => startLevel(1) }];
  if (best > 1) btns.push({ label:'Continue at level ' + best, fn:() => startLevel(best) });
  showCard('Driftwish', 'You cannot touch the lantern. You can only fire shells that blast the air around it. Carry the wish to the moon.', btns);
}

function syncHUD(){
  $('#lvl').textContent = 'Level ' + G.level;
  $('#flame').style.width = clamp(G.flame,0,100) + '%';
  $('#stars').textContent = '★ ' + G.collected + '/3';
  const unlocked = { push:true, pull:G.level >= 3, brake:G.level >= 5 };
  root.querySelectorAll('.shell').forEach(b => {
    const t = b.dataset.type; b.hidden = !unlocked[t];
    $('#n-' + t).textContent = G.shells[t];
    b.classList.toggle('empty', G.shells[t] <= 0);
    b.setAttribute('aria-pressed', String(G.sel === t));
  });
}

/* ---------- effects ---------- */
function spark(x,y,vx,vy,h,s,l,o){
  if (G.parts.length > 2600) return; o = o || {};
  G.parts.push({ x, y, px:x, py:y, vx, vy, h, s, l, life:1, decay:o.decay ?? .02, drag:o.drag ?? .96, g:o.g ?? .03, size:o.size ?? 2 });
}
function addGlow(x,y,r,col,a,decay){ G.glows.push({ x, y, r, col, a, decay:decay ?? .05 }); }

function hslRgb(h){ const sa = .9, l = .6, a = sa*Math.min(l,1-l); const f = n => { const k = (n + h/30) % 12; return Math.round(255*(l - a*Math.max(-1, Math.min(k-3, 9-k, 1)))); }; return `rgb(${f(0)},${f(8)},${f(4)})`; }

function celebrate(x,y){
  const h = rand(0,360), n = 90;
  for (let i=0;i<n;i++){
    const z = Math.random()*2-1, a = Math.random()*TAU, rr = Math.sqrt(1-z*z), sp = 5.2*scale*rand(.9,1.02);
    spark(x,y,Math.cos(a)*rr*sp,Math.sin(a)*rr*sp,(h + (i%2)*40)%360,95,64,{ decay:rand(.011,.016), drag:.965, g:.045 });
  }
  addGlow(x,y,Math.min(W,H)*.4,hslRgb(h),.38,.04);
  sfx.boom('push');
}

/* ---------- shells ---------- */
function fire(x, y){
  const t = G.sel;
  if (G.shells[t] <= 0) return;
  y = Math.min(y, water-24); x = clamp(x, 8, W-8);
  G.shells[t]--;
  G.pending.push({ x, y, type:t, t:0, dur:.28 });
  sfx.whoosh();
  if (G.shells[t] <= 0){ const nx = ['push','pull','brake'].find(k => G.shells[k] > 0); if (nx) G.sel = nx; }
  $('#tip').style.opacity = 0;
  syncHUD();
}

function detonate(p){
  const R = G.R, T = TYPES[p.type];
  G.shocks.push({ x:p.x, y:p.y, type:p.type, r:p.type === 'pull' ? R : 0, R, hitL:false, hitC:new Set() });
  sfx.boom(p.type);
  if (p.type === 'push'){
    for (let i=0;i<70;i++){ const a = Math.random()*TAU, sp = rand(2,6.4)*scale; spark(p.x,p.y,Math.cos(a)*sp,Math.sin(a)*sp,rand(10,46),100,60,{ decay:rand(.02,.034) }); }
    addGlow(p.x,p.y,R*1.2,`rgb(${T.col})`,.4);
  } else if (p.type === 'pull'){
    for (let i=0;i<64;i++){ const a = Math.random()*TAU, d = R*rand(.7,.95); spark(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d,-Math.cos(a)*d/16,-Math.sin(a)*d/16,rand(185,205),90,66,{ decay:.045, drag:.97, g:0 }); }
    addGlow(p.x,p.y,R,`rgb(${T.col})`,.3);
  } else {
    for (let i=0;i<48;i++){ const a = i/48*TAU, sp = 3*scale; spark(p.x,p.y,Math.cos(a)*sp,Math.sin(a)*sp,262,70,82,{ decay:.03, drag:.95, g:0 }); }
    addGlow(p.x,p.y,R,`rgb(${T.col})`,.3);
  }
}

// the velocity change a shell applies to the lantern at its current position
function impulse(type, cx, cy, L){
  const R = G.R, dx = L.x-cx, dy = L.y-cy, d = hyp(dx,dy);
  if (d >= R) return null;
  const f = 1 - d/R;
  if (type === 'push'){
    let ux, uy;
    if (d < 8){ ux = 0; uy = -1; } else { ux = dx/d; uy = dy/d; }
    const m = 8.4*Math.pow(f,1.1) + 1.2;
    return { dvx:ux*m, dvy:uy*m };
  }
  if (type === 'pull'){
    if (d < 4) return { dvx:0, dvy:0 };
    const m = Math.min(d*.085, 5.6*f + .8);
    return { dvx:-dx/d*m, dvy:-dy/d*m };
  }
  const k = .1 + .9*(d/R);
  return { dvx:-L.vx*(1-k), dvy:-L.vy*(1-k) };
}

function applyShock(s){
  const L = G.L, R = s.R;
  const reached = d => s.type === 'pull' ? s.r <= d : s.r >= d;
  const dL = hyp(L.x-s.x, L.y-s.y);
  if (!s.hitL && dL < R && reached(dL)){
    s.hitL = true;
    const v = impulse(s.type, s.x, s.y, L);
    if (v){ L.vx += v.dvx; L.vy += v.dvy; }
  }
  for (const c of G.clouds){
    if (s.hitC.has(c.id)) continue;
    const d = hyp(c.x-s.x, c.y-s.y);
    if (d < R && reached(d)){
      s.hitC.add(c.id);
      const f = 1 - d/R;
      if (s.type === 'push'){ const m = (7*f + 1.4)*(1.2 - c.r/(130*scale)); const u = d < 8 ? [0,-1] : [(c.x-s.x)/d,(c.y-s.y)/d]; c.vx += u[0]*m; c.vy += u[1]*m; }
      else if (s.type === 'pull'){ if (d > 4){ const m = Math.min(d*.05, 3.2*f + .5); c.vx -= (c.x-s.x)/d*m; c.vy -= (c.y-s.y)/d*m; } }
      else { c.vx *= .15; c.vy *= .15; }
    }
  }
}

/* ---------- outcomes ---------- */
function win(){
  if (G.mode !== 'play') return;
  G.mode = 'won'; sfx.win();
  try { if (G.level + 1 > best){ best = G.level + 1; localStorage.setItem('driftwish-best', String(best)); } } catch(_) {}
  const m = G.moon;
  for (let i=0;i<7;i++) later(i*260, () => celebrate(clamp(m.x + rand(-W*.3,W*.3), 40, W-40), rand(H*.16, H*.42)));
  later(1900, () => {
    const left = G.shells.push + G.shells.pull + G.shells.brake;
    const stars = Math.max(1, G.collected);
    showCard('Wish delivered',
      G.collected === 3 ? 'Every star gathered on the way.' : 'Stars gathered: ' + G.collected + ' of 3. Shells left over: ' + left + '.',
      [{ label:'Next level', primary:true, fn:() => startLevel(G.level + 1) }, { label:'Replay', fn:() => startLevel(G.level) }],
      stars);
  });
}
function lose(reason){
  if (G.mode !== 'play') return;
  G.mode = 'lost'; G.L.out = true; G.aim = null;
  later(1000, () => showCard(reason, 'The wish did not make it this time. The same sky is waiting.',
    [{ label:'Try again', primary:true, fn:() => startLevel(G.level) }]));
}

/* ---------- update ---------- */
function update(dt, rawMs){
  G.clock += rawMs;
  const L = G.L;
  // wind streaks always drift
  for (const s of G.streaks){
    const w = windAt(s.y, G.clock/1000);
    s.x += (w*3.4 + (w >= 0 ? .25 : -.25))*s.sp*dt;
    if (s.x > W + 80) s.x = -80; else if (s.x < -80) s.x = W + 80;
  }
  if (G.mode === 'ready'){
    L.y = water - 70 + Math.sin(G.clock/600)*3;
    for (const c of G.clouds) c.x += Math.sin(G.clock/2000 + c.id)*.1;
    return;
  }

  const t = G.clock/1000;
  if (G.mode === 'play'){
    G.t += dt/60;
    if (G.grace > 0) G.grace -= dt;
    L.vx += windAt(L.y,t)*.012*dt;
    L.vy -= .02*clamp(G.flame/100,0,1)*dt;
  } else if (G.mode === 'lost'){
    L.vy += .06*dt;
  }

  if (G.mode === 'won'){
    L.x += (G.moon.x - L.x)*.07*dt; L.y += (G.moon.y - L.y)*.07*dt; L.grow = Math.max(.35, L.grow - .01*dt);
  } else {
    const d = Math.pow(.985, dt);
    L.vx *= d; L.vy *= d; L.x += L.vx*dt; L.y += L.vy*dt;
    const rr = L.s*.5;
    if (L.x < rr){ L.x = rr; L.vx = Math.abs(L.vx)*.5; }
    if (L.x > W-rr){ L.x = W-rr; L.vx = -Math.abs(L.vx)*.5; }
    if (L.y < 92){ L.y = 92; L.vy = Math.abs(L.vy)*.3; }
  }

  // ember trail
  if (G.mode !== 'ready' && Math.random() < .5*dt && !L.out) spark(L.x+rand(-3,3), L.y+L.s*.7, rand(-.2,.2), rand(.1,.5), rand(20,40), 100, 62, { decay:.05, drag:.95, g:.02, size:1.4 });

  // clouds
  let inCloud = false;
  for (let i=G.clouds.length-1;i>=0;i--){
    const c = G.clouds[i];
    c.vx += windAt(c.y,t)*.0045*dt;
    const d = Math.pow(.99, dt); c.vx *= d; c.vy *= d; c.x += c.vx*dt; c.y += c.vy*dt;
    if (c.x < -400 || c.x > W+400 || c.y < -400 || c.y > H+400){ G.clouds.splice(i,1); continue; }
    if (G.mode === 'play' && hyp(L.x-c.x, L.y-c.y) < c.r*.9 + L.s*.4) inCloud = true;
  }
  if (G.mode === 'play'){
    if (inCloud){
      G.flame -= 36*dt/60; L.vx *= Math.pow(.99,dt);
      if (Math.random() < .6*dt) spark(L.x+rand(-10,10), L.y+rand(-10,10), rand(-.8,.8), rand(-.8,.4), 270, 25, 30, { decay:.04, g:-.01, size:3 });
    } else G.flame = Math.min(100, G.flame + 3*dt/60);
    if (G.flame <= 0){ G.flame = 0; sfx.out(); lose('The flame went out'); }
  }

  // pickups, goal, water
  if (G.mode === 'play'){
    for (const p of G.pickups){
      if (!p.got && hyp(L.x-p.x, L.y-p.y) < 28*scale){
        p.got = true; G.collected++; sfx.chime();
        for (let i=0;i<22;i++){ const a = Math.random()*TAU, sp = rand(1,3.4); spark(p.x,p.y,Math.cos(a)*sp,Math.sin(a)*sp,rand(40,52),100,70,{ decay:.04, size:2 }); }
        addGlow(p.x,p.y,70,'rgb(255,210,120)',.35,.06);
        syncHUD();
      }
    }
    if (hyp(L.x-G.moon.x, L.y-G.moon.y) < G.moon.r + 12) win();
    if (G.mode === 'play' && G.grace <= 0 && L.y > water - 12){
      for (let i=0;i<24;i++) spark(L.x+rand(-8,8), water, rand(-1.6,1.6), rand(-4,-1), 200, 40, 80, { decay:.035, g:.12, size:1.6 });
      sfx.splash(); lose('Lost in the water');
    }
    const total = G.shells.push + G.shells.pull + G.shells.brake;
    if (total === 0 && !G.pending.length && !G.shocks.length){ G.outT += dt/60; if (G.outT > 7) lose('Out of shells'); } else G.outT = 0;
    $('#flame').style.width = clamp(G.flame,0,100) + '%';
  } else if (G.mode === 'lost' && L.y > water - 8){
    L.y = water - 8; L.vy = 0; L.vx *= .9;
  }

  // pending shells and shock rings
  for (let i=G.pending.length-1;i>=0;i--){
    const p = G.pending[i]; p.t += dt/60;
    if (p.t >= p.dur){ G.pending.splice(i,1); detonate(p); }
  }
  for (let i=G.shocks.length-1;i>=0;i--){
    const s = G.shocks[i], step = s.R/21*dt;
    if (s.type === 'pull') s.r -= step; else s.r += step;
    if (G.mode === 'play' || G.mode === 'ready') applyShock(s);
    if ((s.type === 'pull' && s.r <= 0) || (s.type !== 'pull' && s.r >= s.R + 8)) G.shocks.splice(i,1);
  }

  // glows and sparks
  for (let i=G.glows.length-1;i>=0;i--){ const g = G.glows[i]; g.a -= g.decay*dt; if (g.a <= 0) G.glows.splice(i,1); }
  for (let i=G.parts.length-1;i>=0;i--){
    const p = G.parts[i]; p.px = p.x; p.py = p.y;
    const d = Math.pow(p.drag, dt); p.vx *= d; p.vy = p.vy*d + p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.decay*dt;
    if (p.life <= 0 || p.y > water){ G.parts[i] = G.parts[G.parts.length-1]; G.parts.pop(); }
  }
}

/* ---------- drawing ---------- */
function rgbaGlow(x,y,r,rgb,a){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
}

function drawLantern(c, x, y, s, f, a){
  const w = s, h = s*1.3;
  const r1 = Math.round(80 + 175*f), g1 = Math.round(40 + 110*f), b1 = Math.round(40 + 20*f);
  const g = c.createLinearGradient(0,y-h/2,0,y+h/2);
  g.addColorStop(0,`rgba(${r1},${g1},${b1},${a})`);
  g.addColorStop(.6,`rgba(${Math.round(r1*.98)},${Math.round(g1*1.3)},${Math.round(b1*1.8)},${a})`);
  g.addColorStop(1,`rgba(${Math.round(r1*.98)},${Math.round(g1*1.5)},${Math.round(b1*3)},${a})`);
  c.fillStyle = g; c.beginPath();
  c.moveTo(x-w*.36,y-h/2); c.lineTo(x+w*.36,y-h/2); c.lineTo(x+w*.5,y+h/2); c.lineTo(x-w*.5,y+h/2); c.closePath(); c.fill();
  c.strokeStyle = `rgba(110,40,0,${a*.5})`; c.lineWidth = Math.max(.8,s*.04);
  for (let k=-1;k<=1;k++){ c.beginPath(); c.moveTo(x+k*w*.18,y-h/2); c.lineTo(x+k*w*.25,y+h/2); c.stroke(); }
  c.fillStyle = `rgba(70,25,0,${a*.9})`;
  c.fillRect(x-w*.38,y-h/2-s*.06,w*.76,s*.09); c.fillRect(x-w*.52,y+h/2-s*.03,w*1.04,s*.09);
}

function arrow(x0,y0,dx,dy,col){
  const len = hyp(dx,dy); if (len < 2) return;
  const x1 = x0+dx, y1 = y0+dy, a = Math.atan2(dy,dx), hd = 9;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-Math.cos(a-.45)*hd,y1-Math.sin(a-.45)*hd); ctx.lineTo(x1-Math.cos(a+.45)*hd,y1-Math.sin(a+.45)*hd); ctx.closePath(); ctx.fill();
}

function sparkle(x,y,r,rot){
  ctx.beginPath();
  for (let k=0;k<8;k++){ const a = rot + k*Math.PI/4, rr = k%2 ? r*.36 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill();
}

function render(){
  const t = G.clock/1000, L = G.L;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgc,0,0,W,H);

  // wind streaks
  ctx.lineCap = 'round'; ctx.lineWidth = 1.3;
  for (const s of G.streaks){
    const w = windAt(s.y,t), sgn = w >= 0 ? 1 : -1, len = s.len*(.35 + Math.min(1,Math.abs(w)*1.3));
    ctx.strokeStyle = `rgba(190,205,255,${.07 + Math.min(.16,Math.abs(w)*.2)})`;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.quadraticCurveTo(s.x - sgn*len*.5, s.y - 4, s.x - sgn*len, s.y); ctx.stroke();
  }

  // wish moon
  const m = G.moon, pulse = Math.sin(t*3)*.5 + .5;
  rgbaGlow(m.x,m.y,m.r*5.5,'200,210,255',.26 + pulse*.06);
  ctx.fillStyle = '#f1efff'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
  ctx.fillStyle = 'rgba(140,150,205,.35)';
  [[-.35,-.2,.28],[.25,.15,.2],[-.1,.4,.14],[.35,-.35,.12]].forEach(([dx,dy,k]) => { ctx.beginPath(); ctx.arc(m.x+dx*m.r,m.y+dy*m.r,k*m.r,0,TAU); ctx.fill(); });
  ctx.strokeStyle = `rgba(255,210,122,${.35 + pulse*.35})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(m.x,m.y,m.r + 9 + pulse*5,0,TAU); ctx.stroke();

  // star pickups
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.pickups){
    if (p.got) continue;
    rgbaGlow(p.x,p.y,34*scale,'255,205,110',.28 + Math.sin(t*4+p.ph)*.08);
    ctx.fillStyle = '#ffe3a1'; sparkle(p.x,p.y,13*scale,t*.8+p.ph);
  }
  ctx.globalCompositeOperation = 'source-over';

  // clouds
  for (const c of G.clouds){
    for (const [dx,dy,pr] of c.puffs){
      const g = ctx.createRadialGradient(c.x+dx,c.y+dy,pr*.1,c.x+dx,c.y+dy,pr);
      g.addColorStop(0,'rgba(58,44,96,.95)'); g.addColorStop(.7,'rgba(38,28,72,.9)'); g.addColorStop(1,'rgba(38,28,72,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x+dx,c.y+dy,pr,0,TAU); ctx.fill();
    }
    const ph = (t + c.flash) % 3.6;
    if (ph < .22){
      ctx.globalCompositeOperation = 'lighter';
      rgbaGlow(c.x,c.y,c.r*1.3,'170,150,255',.22*(1-ph/.22));
      ctx.strokeStyle = `rgba(235,225,255,${.8*(1-ph/.22)})`; ctx.lineWidth = 1.6; ctx.beginPath();
      let lx = c.x + c.puffs[0][0], ly = c.y - c.r*.2; ctx.moveTo(lx,ly);
      for (let k=0;k<4;k++){ lx += ((c.id*7+k*5)%9 - 4)*2.4; ly += c.r*.22; ctx.lineTo(lx,ly); }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  // glows, shock rings
  ctx.globalCompositeOperation = 'lighter';
  for (const g of G.glows) rgbaGlow(g.x,g.y,g.r,g.col.slice(4,-1),Math.max(0,g.a));
  for (const s of G.shocks){
    const T = TYPES[s.type], f = s.type === 'pull' ? s.r/s.R : 1 - s.r/s.R;
    ctx.strokeStyle = `rgba(${T.col},${clamp(f,0,1)*.9})`; ctx.lineWidth = 3 + f*3;
    ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(1,s.r),0,TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  // lantern + reflection
  const f = L.out ? .06 : clamp(G.flame/100,0,1)*.9 + .1, s = L.s*L.grow;
  ctx.save(); ctx.beginPath(); ctx.rect(0,water,W,H-water); ctx.clip();
  ctx.translate(0,2*water); ctx.scale(1,-1);
  if (L.y + s < water) drawLantern(ctx,L.x,L.y,s,f,.22);
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';
  rgbaGlow(L.x,L.y,s*(1.4 + 2.6*f),'255,150,60',.34*f*(.85 + .15*Math.sin(t*14)));
  ctx.globalCompositeOperation = 'source-over';
  drawLantern(ctx,L.x,L.y,s,f,.96);
  ctx.globalCompositeOperation = 'lighter';
  rgbaGlow(L.x,L.y+s*.36,s*.75,'255,235,170',.9*f*(.85 + .15*Math.sin(t*19)));
  ctx.globalCompositeOperation = 'source-over';

  // rockets
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of G.pending){
    const e = 1 - Math.pow(1 - clamp(p.t/p.dur,0,1), 2), y = lerp(water, p.y, e), y0 = lerp(water, p.y, Math.max(0,e-.25));
    ctx.strokeStyle = `rgba(${TYPES[p.type].col},.95)`; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(p.x,y0); ctx.lineTo(p.x,y); ctx.stroke();
  }

  // sparks
  for (const p of G.parts){
    const a = Math.pow(Math.max(p.life,0),.85), hot = p.life > .85 ? (p.life-.85)/.15 : 0;
    ctx.strokeStyle = `hsla(${p.h},${p.s}%,${p.l + (100-p.l)*hot*.8}%,${a})`;
    ctx.lineWidth = p.size*(.55 + .45*p.life);
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x+.01,p.y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  // aim preview
  const A = G.aim;
  if (A && G.mode === 'play' && G.shells[G.sel] > 0){
    const T = TYPES[G.sel], ay = Math.min(A.y, water-24), col = `rgba(${T.col},.95)`;
    ctx.setLineDash([6,7]); ctx.lineWidth = 1.6; ctx.strokeStyle = `rgba(${T.col},.6)`;
    ctx.beginPath(); ctx.arc(A.x,ay,G.R,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(A.x,ay,4,0,TAU); ctx.fill();
    const v = impulse(G.sel, A.x, ay, L);
    if (v){
      if (G.sel === 'brake'){ ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(L.x,L.y,s*1.1 + Math.sin(t*10)*2,0,TAU); ctx.stroke(); }
      else arrow(L.x, L.y, v.dvx*14, v.dvy*14, col);
    }
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  if (!active) return;
  const raw = Math.min(50, now - last); last = now;
  update(raw/16.667, raw);
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  sfx.init(); sfx.resume();
  if (G.mode !== 'play') return;
  if (G.shells[G.sel] <= 0){ const b = root.querySelector(`.shell[data-type="${G.sel}"]`); if (b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } return; }
  const [x,y] = pos(e); G.aim = { x, y, down:true };
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
});
cv.addEventListener('pointermove', e => {
  const [x,y] = pos(e);
  if (G.aim && G.aim.down){ G.aim.x = x; G.aim.y = y; }
  else if (e.pointerType === 'mouse' && G.mode === 'play') G.aim = { x, y, down:false };
});
function release(){
  const A = G.aim;
  if (A && A.down && G.mode === 'play') fire(A.x, A.y);
  G.aim = null;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { G.aim = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && G.aim && !G.aim.down) G.aim = null; });

root.querySelectorAll('.shell').forEach(b => b.addEventListener('click', () => {
  sfx.init(); sfx.resume(); G.sel = b.dataset.type; syncHUD();
}));
$('#rst').addEventListener('click', () => { sfx.init(); startLevel(G.level, false); });
$('#snd').addEventListener('click', e => { sfx.init(); sfx.resume(); sfx.on = !sfx.on; e.currentTarget.setAttribute('aria-pressed', String(sfx.on)); });
document.addEventListener('keydown', e => {
  if (!active) return;
  e.stopPropagation();
  const k = e.key.toLowerCase();
  if (k === 'escape'){ onExit(); return; }
  if (k === 'r'){ startLevel(G.level, false); }
  else if (k === 'm'){ sfx.on = !sfx.on; $('#snd').setAttribute('aria-pressed', String(sfx.on)); }
  else if (k >= '1' && k <= '3'){
    const t = ['push','pull','brake'][Number(k)-1];
    if (!root.querySelector(`.shell[data-type="${t}"]`).hidden){ G.sel = t; syncHUD(); }
  }
});
addEventListener('resize', () => { if (active) layout(); });
$('#exit').addEventListener('click', () => onExit());

let active = false, inited = false;
return {
  open(){
    active = true;
    layout();
    if (!inited){ inited = true; startLevel(1, true); }
    last = performance.now();
    requestAnimationFrame(frame);
  },
  close(){ active = false; }
};
}


(() => {
  const host = document.getElementById('gameHost');
  let api = null;
  function closeGame(){
    if (!api) return;
    api.close();
    host.style.display = 'none';
    window.__gameOpen = false;
    if (window.__skyburst) window.__skyburst.pause(false);
    try { if (location.hash === '#driftwish') location.hash = ''; } catch(_) {}
  }
  function openGame(){
    if (!api){
      const root = host.attachShadow({ mode:'open' });
      root.appendChild(document.getElementById('gameTpl').content.cloneNode(true));
      api = mountDriftwish(root, closeGame);
    }
    window.__gameOpen = true;
    if (window.__skyburst) window.__skyburst.pause(true);
    host.style.display = 'block';
    try { if (location.hash !== '#driftwish') location.hash = 'driftwish'; } catch(_) {}
    api.open();
  }
  window.__openDriftwish = openGame;
  if (location.hash === '#driftwish') openGame();
})();
